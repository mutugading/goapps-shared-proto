syntax = "proto3";

package finance.v1;

import "buf/validate/validate.proto";
import "common/v1/common.proto";
import "google/api/annotations.proto";

// =============================================================================
// CostProductMaster — PRD Phase B §7.4.1 (CPM_).
// Costing-system product identity, separate from ERP. Code auto-generated by
// server: CST + product_type.type_code + YYMM + LPAD(seq, 6, '0').
// ERP linkage fields (erp_item_code / erp_grade_code_1 / erp_grade_code_2) are
// informational — populated AFTER the product appears in ERP.
// =============================================================================

message CostProductMaster {
  int64 product_sys_id = 1;
  string product_code = 2; // auto-generated, read-only
  int32 product_type_id = 3;
  string product_type_code = 4; // denormalized for UI display
  string product_type_name = 5;
  string product_name = 6;
  string shade_code = 7;
  string grade_code = 8; // default 'AX'
  string description = 9;
  string erp_item_code = 10;
  string erp_grade_code_1 = 11;
  string erp_grade_code_2 = 12;
  string erp_linked_at = 13;
  string erp_linked_by = 14;
  bool is_active = 15;
  common.v1.AuditInfo audit = 16;
  string shade_name = 17;
  string flex_01 = 18;
  string flex_02 = 19;
  string flex_03 = 20;
  string source = 21; // origin marker, e.g. "MB_RECIPE" when auto-generated; empty if manually created
  bool is_locked = 22; // true blocks manual edits to route/params; escape hatch via UnlockCostProductMaster
  string erp_fg_type = 23;
  string erp_chp_item_code = 24;
  string erp_ms_batch_item = 25;
  string erp_item_type = 26;
  string erp_prd_per_day = 27; // decimal string
  // Per-product RM ratio mode: "" = follow product type, INPUT or DENIER (migration 000579).
  string rm_ratio_mode_override = 28;
  // COALESCE(product override, product type mode); read-only.
  string effective_rm_ratio_mode = 29;
}

// =============================================================================
// Create — server auto-generates product_code; client supplies type + name + shade + grade.
// =============================================================================

message CreateCostProductMasterRequest {
  int32 product_type_id = 1 [(buf.validate.field).int32.gte = 1];
  string product_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
  string shade_code = 3 [(buf.validate.field).string.max_len = 50];
  string grade_code = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 20
  }];
  string description = 5 [(buf.validate.field).string.max_len = 1000];
  // Legacy / import identifiers — plain text, no validation constraint.
  string flex_01 = 6 [(buf.validate.field).string.max_len = 255]; // legacy_erp_compound_key
  string flex_02 = 7 [(buf.validate.field).string.max_len = 100]; // legacy_oracle_sys_id
  string flex_03 = 8 [(buf.validate.field).string.max_len = 100]; // legacy_type_label
  // ERP linkage identifiers (optional, empty = unset).
  string erp_fg_type = 9 [(buf.validate.field).string.max_len = 15];
  string erp_chp_item_code = 10 [(buf.validate.field).string.max_len = 50];
  string erp_ms_batch_item = 11 [(buf.validate.field).string.max_len = 12];
  string erp_item_type = 12 [(buf.validate.field).string.max_len = 20];
  string erp_prd_per_day = 13 [(buf.validate.field).string.pattern = "^([0-9]{1,12}(\\.[0-9]{1,6})?)?$"]; // decimal string
  // ERP item code (optional; used for inline minimal POY creation). Empty = unset.
  string erp_item_code = 14 [(buf.validate.field).string.max_len = 50];
}

message CreateCostProductMasterResponse {
  common.v1.BaseResponse base = 1;
  CostProductMaster data = 2;
}

message GetCostProductMasterRequest {
  int64 product_sys_id = 1 [(buf.validate.field).int64.gte = 1];
}

message GetCostProductMasterResponse {
  common.v1.BaseResponse base = 1;
  CostProductMaster data = 2;
}

message GetCostProductMasterByCodeRequest {
  string product_code = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 20
  }];
}

message GetCostProductMasterByCodeResponse {
  common.v1.BaseResponse base = 1;
  CostProductMaster data = 2;
}

// =============================================================================
// Update — product_code + product_type_id are immutable.
// =============================================================================

message UpdateCostProductMasterRequest {
  int64 product_sys_id = 1 [(buf.validate.field).int64.gte = 1];
  string product_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
  string shade_code = 3 [(buf.validate.field).string.max_len = 50];
  string grade_code = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 20
  }];
  string description = 5 [(buf.validate.field).string.max_len = 1000];
  // Legacy / import identifiers — plain text, no validation constraint.
  string flex_01 = 6 [(buf.validate.field).string.max_len = 255]; // legacy_erp_compound_key
  string flex_02 = 7 [(buf.validate.field).string.max_len = 100]; // legacy_oracle_sys_id
  string flex_03 = 8 [(buf.validate.field).string.max_len = 100]; // legacy_type_label
  // ERP linkage identifiers (optional, empty = unset).
  string erp_fg_type = 9 [(buf.validate.field).string.max_len = 15];
  string erp_chp_item_code = 10 [(buf.validate.field).string.max_len = 50];
  string erp_ms_batch_item = 11 [(buf.validate.field).string.max_len = 12];
  string erp_item_type = 12 [(buf.validate.field).string.max_len = 20];
  string erp_prd_per_day = 13 [(buf.validate.field).string.pattern = "^([0-9]{1,12}(\\.[0-9]{1,6})?)?$"]; // decimal string
  // Per-product RM ratio mode override. Absent = unchanged; "" = clear (follow product type).
  optional string rm_ratio_mode_override = 14 [(buf.validate.field).string = {
    in: [
      "",
      "INPUT",
      "DENIER"
    ]
  }];
}

message UpdateCostProductMasterResponse {
  common.v1.BaseResponse base = 1;
  CostProductMaster data = 2;
}

// =============================================================================
// Update ERP linkage — separate RPC because it's typically called later after
// the product appears in ERP. Records erp_linked_at / erp_linked_by.
// =============================================================================

message UpdateCostProductMasterErpLinkageRequest {
  int64 product_sys_id = 1 [(buf.validate.field).int64.gte = 1];
  string erp_item_code = 2 [(buf.validate.field).string.max_len = 50];
  string erp_grade_code_1 = 3 [(buf.validate.field).string.max_len = 20];
  string erp_grade_code_2 = 4 [(buf.validate.field).string.max_len = 20];
  // ERP linkage identifiers (optional, empty = unset).
  string erp_fg_type = 5 [(buf.validate.field).string.max_len = 15];
  string erp_chp_item_code = 6 [(buf.validate.field).string.max_len = 50];
  string erp_ms_batch_item = 7 [(buf.validate.field).string.max_len = 12];
  string erp_item_type = 8 [(buf.validate.field).string.max_len = 20];
  string erp_prd_per_day = 9 [(buf.validate.field).string.pattern = "^([0-9]{1,12}(\\.[0-9]{1,6})?)?$"]; // decimal string
}

message UpdateCostProductMasterErpLinkageResponse {
  common.v1.BaseResponse base = 1;
  CostProductMaster data = 2;
}

// =============================================================================
// Deactivate — soft delete. Rejected if used as component in active product orders.
// =============================================================================

message DeactivateCostProductMasterRequest {
  int64 product_sys_id = 1 [(buf.validate.field).int64.gte = 1];
}

message DeactivateCostProductMasterResponse {
  common.v1.BaseResponse base = 1;
}

// =============================================================================
// Unlock — finance-admin escape hatch for MB-recipe-locked products. Clears
// cpm_is_locked for 24h and records an mst_mb_lock_log audit row; the product
// auto-relocks after the window (enforced server-side, not by this RPC).
// =============================================================================

message UnlockCostProductMasterRequest {
  int64 product_sys_id = 1 [(buf.validate.field).int64.gte = 1];
  string reason = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
}

message UnlockCostProductMasterResponse {
  common.v1.BaseResponse base = 1;
  CostProductMaster data = 2;
}

// =============================================================================
// List — paginated browse with rich filters.
// =============================================================================

message ListCostProductMastersRequest {
  string search = 1 [(buf.validate.field).string.max_len = 200]; // matches product_code OR product_name OR erp_item_code OR oracle sys id (flex_02)
  int32 product_type_id = 2;
  string shade_code = 3 [(buf.validate.field).string.max_len = 50];
  string active_filter = 4 [(buf.validate.field).string = {
    in: [
      "",
      "all",
      "active",
      "inactive"
    ]
  }];
  common.v1.PaginationRequest pagination = 5;
  string sort_by = 6 [(buf.validate.field).string = {
    in: [
      "",
      "product_code",
      "product_name",
      "created_at",
      "updated_at",
      "product_type_code",
      "shade_code",
      "grade_code",
      "oracle_sys_id",
      "erp_compound_key",
      "type_label",
      "status"
    ]
  }];
  string sort_order = 7 [(buf.validate.field).string = {
    in: [
      "",
      "asc",
      "desc"
    ]
  }];
  repeated int32 product_type_ids = 8; // additional type filter, unioned with product_type_id
}

message ListCostProductMastersResponse {
  common.v1.BaseResponse base = 1;
  repeated CostProductMaster data = 2;
  common.v1.PaginationResponse pagination = 3;
}

// ── Export ───────────────────────────────────────────────────────────────────

message ExportCostProductMastersRequest {
  string product_type_code = 1 [(buf.validate.field).string.max_len = 5];
  string active_filter = 2 [(buf.validate.field).string = {
    in: [
      "",
      "all",
      "active",
      "inactive"
    ]
  }];
  string search = 3 [(buf.validate.field).string.max_len = 200];
}

message ExportCostProductMastersResponse {
  common.v1.BaseResponse base = 1;
  bytes file_content = 2;
  string file_name = 3;
}

// ── Async Import ──────────────────────────────────────────────────────────────

message ImportCostProductMastersRequest {
  bytes file_content = 1 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 52428800
  }];
  string file_name = 2 [(buf.validate.field).string.pattern = "(?i)^.+\\.xlsx?$"];
  string duplicate_action = 3 [(buf.validate.field).string = {
    in: [
      "skip",
      "update",
      "error"
    ]
  }];
}

message ImportCostProductMastersResponse {
  common.v1.BaseResponse base = 1;
  int64 job_id = 2;
}

message DownloadCostProductMasterTemplateRequest {}

message DownloadCostProductMasterTemplateResponse {
  common.v1.BaseResponse base = 1;
  bytes file_content = 2;
  string file_name = 3;
}

// =============================================================================
// Duplicate — clones a product row (new auto-generated code) and, optionally,
// its applicable params (CAPP) + param values (CPP). No route is touched.
// =============================================================================

message DuplicateProductRequest {
  int64 product_sys_id = 1 [(buf.validate.field).int64.gte = 1];
  string new_code_prefix = 2 [(buf.validate.field).string.max_len = 40];
  bool copy_params = 3;
}

message DuplicateProductResponse {
  common.v1.BaseResponse base = 1;
  int64 new_product_sys_id = 2;
  string new_product_code = 3;
}

// RMDenierOverride is a per-product denier override for one RM (product or group).
message RMDenierOverride {
  int64 id = 1;
  int64 product_sys_id = 2;
  // PRODUCT | GROUP.
  string rm_type = 3;
  int64 rm_product_sys_id = 4;
  string rm_product_code = 5;
  string rm_product_name = 6;
  string rm_group_code = 7;
  string rm_group_name = 8;
  double denier = 9;
  string reason = 10;
  string created_at = 11;
  string created_by = 12;
  string updated_at = 13;
  string updated_by = 14;
}

// DuplicateProductRef identifies a product sharing the same duplicate family.
message DuplicateProductRef {
  int64 product_sys_id = 1;
  string product_code = 2;
  string product_name = 3;
}

message ListRMDenierOverridesRequest {
  int64 product_sys_id = 1 [(buf.validate.field).int64.gt = 0];
}

message ListRMDenierOverridesResponse {
  common.v1.BaseResponse base = 1;
  repeated RMDenierOverride data = 2;
  repeated DuplicateProductRef duplicate_products = 3;
}

message UpsertRMDenierOverrideRequest {
  int64 product_sys_id = 1 [(buf.validate.field).int64.gt = 0];
  string rm_type = 2 [(buf.validate.field).string = {
    in: [
      "PRODUCT",
      "GROUP"
    ]
  }];
  int64 rm_product_sys_id = 3 [(buf.validate.field).int64.gte = 0];
  string rm_group_code = 4 [(buf.validate.field).string.max_len = 30];
  double denier = 5 [(buf.validate.field).double.gt = 0];
  string reason = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
  bool apply_to_duplicates = 7;
}

message UpsertRMDenierOverrideResponse {
  common.v1.BaseResponse base = 1;
  RMDenierOverride data = 2;
  repeated int64 applied_product_sys_ids = 3;
}

message DeleteRMDenierOverrideRequest {
  int64 product_sys_id = 1 [(buf.validate.field).int64.gt = 0];
  string rm_type = 2 [(buf.validate.field).string = {
    in: [
      "PRODUCT",
      "GROUP"
    ]
  }];
  int64 rm_product_sys_id = 3 [(buf.validate.field).int64.gte = 0];
  string rm_group_code = 4 [(buf.validate.field).string.max_len = 30];
  bool apply_to_duplicates = 5;
}

message DeleteRMDenierOverrideResponse {
  common.v1.BaseResponse base = 1;
  int32 deleted_count = 2;
  repeated int64 applied_product_sys_ids = 3;
}

service CostProductMasterService {
  rpc CreateCostProductMaster(CreateCostProductMasterRequest) returns (CreateCostProductMasterResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/cost-product-master"
      body: "*"
    };
  }
  rpc GetCostProductMaster(GetCostProductMasterRequest) returns (GetCostProductMasterResponse) {
    option (google.api.http) = {get: "/api/v1/finance/cost-product-master/{product_sys_id}"};
  }
  rpc GetCostProductMasterByCode(GetCostProductMasterByCodeRequest) returns (GetCostProductMasterByCodeResponse) {
    option (google.api.http) = {get: "/api/v1/finance/cost-product-master/by-code/{product_code}"};
  }
  rpc UpdateCostProductMaster(UpdateCostProductMasterRequest) returns (UpdateCostProductMasterResponse) {
    option (google.api.http) = {
      put: "/api/v1/finance/cost-product-master/{product_sys_id}"
      body: "*"
    };
  }
  rpc UpdateCostProductMasterErpLinkage(UpdateCostProductMasterErpLinkageRequest) returns (UpdateCostProductMasterErpLinkageResponse) {
    option (google.api.http) = {
      put: "/api/v1/finance/cost-product-master/{product_sys_id}/erp-linkage"
      body: "*"
    };
  }
  rpc DeactivateCostProductMaster(DeactivateCostProductMasterRequest) returns (DeactivateCostProductMasterResponse) {
    option (google.api.http) = {delete: "/api/v1/finance/cost-product-master/{product_sys_id}"};
  }
  rpc UnlockCostProductMaster(UnlockCostProductMasterRequest) returns (UnlockCostProductMasterResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/cost-product-master/{product_sys_id}/unlock"
      body: "*"
    };
  }
  rpc ListCostProductMasters(ListCostProductMastersRequest) returns (ListCostProductMastersResponse) {
    option (google.api.http) = {get: "/api/v1/finance/cost-product-master"};
  }

  rpc ExportCostProductMasters(ExportCostProductMastersRequest) returns (ExportCostProductMastersResponse) {
    option (google.api.http) = {get: "/api/v1/finance/cost-product-masters/export"};
  }

  rpc ImportCostProductMasters(ImportCostProductMastersRequest) returns (ImportCostProductMastersResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/cost-product-masters/import"
      body: "*"
    };
  }

  rpc DownloadCostProductMasterTemplate(DownloadCostProductMasterTemplateRequest) returns (DownloadCostProductMasterTemplateResponse) {
    option (google.api.http) = {get: "/api/v1/finance/cost-product-masters/template"};
  }

  rpc DuplicateProduct(DuplicateProductRequest) returns (DuplicateProductResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/cost-product-master/{product_sys_id}/duplicate"
      body: "*"
    };
  }

  rpc ListRMDenierOverrides(ListRMDenierOverridesRequest) returns (ListRMDenierOverridesResponse) {
    option (google.api.http) = {get: "/api/v1/finance/cost-product-master/{product_sys_id}/rm-denier-overrides"};
  }

  rpc UpsertRMDenierOverride(UpsertRMDenierOverrideRequest) returns (UpsertRMDenierOverrideResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/cost-product-master/{product_sys_id}/rm-denier-overrides"
      body: "*"
    };
  }

  rpc DeleteRMDenierOverride(DeleteRMDenierOverrideRequest) returns (DeleteRMDenierOverrideResponse) {
    option (google.api.http) = {delete: "/api/v1/finance/cost-product-master/{product_sys_id}/rm-denier-overrides"};
  }

  // GetCostProductMbLink resolves the MB spin link for a product (FG_MATCH | SHADE_ONLY | SUPERBA | NONE).
  rpc GetCostProductMbLink(GetCostProductMbLinkRequest) returns (GetCostProductMbLinkResponse) {
    option (google.api.http) = {get: "/api/v1/finance/cost-product-master/{product_sys_id}/mb-link"};
  }

  // RelinkCostProductMb forces MB autofill (re-link) for a product.
  rpc RelinkCostProductMb(RelinkCostProductMbRequest) returns (RelinkCostProductMbResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/cost-product-master/{product_sys_id}/mb-relink"
      body: "*"
    };
  }

  // PreviewProductEtlFromOracle previews products to import from Oracle legacy.
  rpc PreviewProductEtlFromOracle(PreviewProductEtlFromOracleRequest) returns (PreviewProductEtlFromOracleResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/cost-product-master/etl/preview"
      body: "*"
    };
  }

  // ApplyProductEtlFromOracle inserts the selected rows of a previous preview run.
  rpc ApplyProductEtlFromOracle(ApplyProductEtlFromOracleRequest) returns (ApplyProductEtlFromOracleResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/cost-product-master/etl/apply"
      body: "*"
    };
  }
}

// =============================================================================
// MB link + Oracle product ETL (mb-spin-fg-poy-link).
// =============================================================================

// CostProductMbLink describes how a product resolves to an MB spin.
message CostProductMbLink {
  // FG_MATCH | SHADE_ONLY | SUPERBA | NONE.
  string link_source = 1;
  // Resolved spin UUID.
  string spin_id = 2;
  // Resolved spin code.
  string spin_code = 3;
  // Resolved spin shade code.
  string spin_shade_code = 4;
  // FG product id (0 = none).
  int64 fg_product_id = 5;
  // FG product code.
  string fg_product_code = 6;
  // Candidate POY product ids when ambiguous.
  repeated int64 candidate_poy_product_ids = 7;
  // Human-readable reason.
  string reason = 8;
  // Current MB_SP_CODE param text value.
  string current_param_value = 9;
  // True when current_param_value matches the resolved spin.
  bool param_matches = 10;
}

message GetCostProductMbLinkRequest {
  int64 product_sys_id = 1 [(buf.validate.field).int64.gte = 1];
}

message GetCostProductMbLinkResponse {
  common.v1.BaseResponse base = 1;
  CostProductMbLink data = 2;
}

message RelinkCostProductMbRequest {
  int64 product_sys_id = 1 [(buf.validate.field).int64.gte = 1];
}

message RelinkCostProductMbResponse {
  common.v1.BaseResponse base = 1;
  CostProductMbLink data = 2;
}

message PreviewProductEtlFromOracleRequest {
  // Start date YYYY-MM-DD.
  string from_date = 1 [(buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"];
  // Free-text search (max 200 chars).
  string search = 2 [(buf.validate.field).string.max_len = 200];
  // Include rows that already exist.
  bool include_existing = 3;
}

// ProductEtlRow is one preview row.
message ProductEtlRow {
  // "<item>|<shade>".
  string row_key = 1;
  string merge_item_orion = 2;
  string item_name = 3;
  string shade_code = 4;
  string shade_name = 5;
  string type_code = 6;
  // EXISTS | EXISTS_MULTI | NEW_SHADE | NEW_ITEM | POSSIBLE_DUPLICATE | INVALID_TYPE.
  string status = 7;
  // Whether the row can be applied.
  bool selectable = 8;
  repeated int64 matched_product_ids = 9;
  string denier = 10;
  string filament = 11;
  string note = 12;
}

// ProductEtlCounts holds per-status counts.
message ProductEtlCounts {
  int32 exists = 1;
  int32 exists_multi = 2;
  int32 new_shade = 3;
  int32 new_item = 4;
  int32 possible_duplicate = 5;
  int32 invalid_type = 6;
  int32 total = 7;
}

message ProductEtlPreview {
  // Run token (UUID) to pass to apply.
  string run_id = 1;
  string from_date = 2;
  repeated ProductEtlRow rows = 3;
  ProductEtlCounts counts = 4;
  // Max rows accepted per apply call.
  int32 apply_limit = 5;
}

message PreviewProductEtlFromOracleResponse {
  common.v1.BaseResponse base = 1;
  ProductEtlPreview data = 2;
}

message ApplyProductEtlFromOracleRequest {
  // Run token returned by preview.
  string preview_run_id = 1 [(buf.validate.field).string.uuid = true];
  // Selected row keys.
  repeated string row_keys = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 500
  }];
}

// ProductEtlApplyRow is the per-row apply result.
message ProductEtlApplyRow {
  string row_key = 1;
  // INSERTED | SKIPPED | FAILED.
  string result = 2;
  int64 product_sys_id = 3;
  string product_code = 4;
  string message = 5;
}

message ProductEtlApplyResult {
  string run_id = 1;
  int32 inserted = 2;
  int32 skipped = 3;
  int32 failed = 4;
  repeated ProductEtlApplyRow rows = 5;
}

message ApplyProductEtlFromOracleResponse {
  common.v1.BaseResponse base = 1;
  ProductEtlApplyResult data = 2;
}
