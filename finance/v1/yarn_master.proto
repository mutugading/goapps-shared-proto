// =============================================================================
// MESSAGES — MB Push-to-Head
// =============================================================================

// PreviewPushToHeadRequest is the request for previewing which MB Heads are pushable for a period.
message PreviewPushToHeadRequest {
  // Period in YYYYMM format.
  string period = 1 [(buf.validate.field).string.pattern = "^[0-9]{6}$"];
}

// PushableMbHead describes an MB Head eligible to receive pushed costs for the previewed period.
message PushableMbHead {
  // MB Head UUID.
  string mbh_id = 1;
  // Batch cost code.
  string code = 2;
  // Management display name.
  string name = 3;
  // Whether an ACTUAL cost value is available to push.
  bool has_actual = 4;
  // Whether a SELLING cost value is available to push.
  bool has_selling = 5;
  // Whether a FORECAST cost value is available to push.
  bool has_forecast = 6;
  // Whether this head was already pushed for the period but its pushed cost has since gone
  // stale — the source cst_product_cost row is SUPERSEDED (or unlinked) and a newer
  // non-superseded row exists. Informational only: such a head is still pushable, and
  // re-pushing is exactly the remedy.
  bool needs_repush = 7;
}

// SkippedMbHead describes an MB Head excluded from the push, with the reason why.
message SkippedMbHead {
  // MB Head UUID.
  string mbh_id = 1;
  // Batch cost code.
  string code = 2;
  // Management display name.
  string name = 3;
  // Reason this head was skipped.
  string reason = 4;
}

// PreviewPushToHeadResponse is the response listing pushable and skipped MB Heads for a period.
message PreviewPushToHeadResponse {
  // Standard response metadata.
  common.v1.BaseResponse base = 1;
  // MB Heads eligible for push.
  repeated PushableMbHead pushable = 2;
  // MB Heads excluded from push, with reasons.
  repeated SkippedMbHead skipped = 3;
  // Count of pushable heads flagged needs_repush — heads whose already-pushed cost went stale
  // after a later MB Batch run. Surfaced as its own bucket so operators can act on it.
  int32 needs_repush_count = 4;
}

// ExecutePushToHeadRequest is the request for executing a push-to-head batch for a period.
message ExecutePushToHeadRequest {
  // Period in YYYYMM format.
  string period = 1 [(buf.validate.field).string.pattern = "^[0-9]{6}$"];
  // MB Head UUIDs to push.
  repeated string mb_head_ids = 2 [(buf.validate.field).repeated.min_items = 1];
}

// ExecutePushToHeadResponse is the response for executing a push-to-head batch.
message ExecutePushToHeadResponse {
  // Standard response metadata.
  common.v1.BaseResponse base = 1;
  // Resulting push log record.
  MbPushLog data = 2;
}

// ListMbPushLogsRequest is the request for listing push-to-head batch logs.
message ListMbPushLogsRequest {
  // Page number (≥ 1).
  int32 page = 1 [(buf.validate.field).int32.gte = 1];
  // Page size (1-100).
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  // Filter by period in YYYYMM format. Optional — omit or send empty for no filter.
  string period = 3 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {pattern: "^[0-9]{6}$"}
  }];
}

// ListMbPushLogsResponse is the response for listing push-to-head batch logs.
message ListMbPushLogsResponse {
  // Standard response metadata.
  common.v1.BaseResponse base = 1;
  // Push log records.
  repeated MbPushLog data = 2;
  // Pagination metadata.
  common.v1.PaginationResponse pagination = 3;
}

