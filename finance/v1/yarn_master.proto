    in: [
      "",
      "from_code",
      "to_code",
      "factor",
      "created_at"
    ]
  }];
  // Sort direction.
  string sort_dir = 5 [(buf.validate.field).string = {
    in: [
      "",
      "asc",
      "desc"
    ]
  }];
  // Filter by active status.
  ActiveFilter active_filter = 6;
  // Optional exact filter on the source cross-section code.
  string from_code = 7 [(buf.validate.field).string.max_len = 10];
  // Optional exact filter on the target cross-section code.
  string to_code = 8 [(buf.validate.field).string.max_len = 10];
}

// ListMbCrossSectionFactorResponse is the response for listing cross-section conversion factors.
message ListMbCrossSectionFactorResponse {
  // Standard response metadata.
  common.v1.BaseResponse base = 1;
  // Factor records.
  repeated MbCrossSectionFactor data = 2;
  // Pagination metadata.
  common.v1.PaginationResponse pagination = 3;
}

// UpdateMbCrossSectionFactorRequest is the request for updating a cross-section conversion factor.
message UpdateMbCrossSectionFactorRequest {
  // Factor UUID.
  string mbcf_id = 1 [(buf.validate.field).string.uuid = true];
  // Updated conversion factor, strictly greater than zero.
  double factor = 2 [(buf.validate.field).double.gt = 0];
  // Updated arithmetic direction: MULTIPLY or DIVIDE.
  string operation = 3 [(buf.validate.field).string = {
    in: [
      "MULTIPLY",
      "DIVIDE"
    ]
  }];
  // Updated note.
  string note = 4 [(buf.validate.field).string.max_len = 200];
  // Updated active status.
  bool is_active = 5;
}

// UpdateMbCrossSectionFactorResponse is the response for updating a cross-section conversion factor.
message UpdateMbCrossSectionFactorResponse {
  // Standard response metadata.
  common.v1.BaseResponse base = 1;
  // Updated factor record.
  MbCrossSectionFactor data = 2;
}

// DeleteMbCrossSectionFactorRequest is the request for deleting a cross-section conversion factor.
message DeleteMbCrossSectionFactorRequest {
  // Factor UUID.
  string mbcf_id = 1 [(buf.validate.field).string.uuid = true];
}

// DeleteMbCrossSectionFactorResponse is the response for deleting a cross-section conversion factor.
message DeleteMbCrossSectionFactorResponse {
  // Standard response metadata.
  common.v1.BaseResponse base = 1;
}

