// =============================================================================
// MESSAGES — MB Head
// =============================================================================

// MBHeadShade is one additional shade of an MB recipe (max 2 per recipe).
// Mirrors mst_mb_head_shade (migration 000483): mbhs_shade_code is NOT NULL,
// mbhs_shade_name is nullable, and mbhs_seq_no is constrained to (1, 2).
message MBHeadShade {
  // UUID primary key (mbhs_id).
  string mbhs_id = 1;
  // Sequence number of the additional shade. 1 or 2.
  int32 mbhs_seq_no = 2;
  // Shade code. Always present (NOT NULL in DB).
  string mbhs_shade_code = 3;
  // Shade name. May be empty — column is nullable in DB.
  string mbhs_shade_name = 4;
}

// MBHeadShadeInput is an additional-shade row supplied on create/update.
message MBHeadShadeInput {
  // Sequence number of the additional shade. 1 or 2 (DB CHECK mbhs_seq_no IN (1, 2)).
  int32 mbhs_seq_no = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 2
  }];
  // Shade code (max 20 chars). Required — NOT NULL in DB.
  string mbhs_shade_code = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 20
  }];
  // Shade name (max 100 chars). Optional — nullable in DB.
  optional string mbhs_shade_name = 3 [(buf.validate.field).string.max_len = 100];
}

// MBHead represents a Melange Batch head master record (MEL yarn type only).
message MBHead {
  // UUID primary key.
  string mbh_id = 1;
  // Oracle PK for import reconciliation (optional).
  string mbh_oracle_sys_id = 2;
  // Batch cost code / identifier. Unique.
  string mbh_mb_costing = 3;
  // Management display name.
  string mbh_mgt_name = 4;
  // Yarn denier (dtex). Optional.
  optional double mbh_denier = 5;
  // Number of filaments. Optional.
  optional int32 mbh_filament = 6;
  // Dozing percentage. Optional.
  optional double mbh_dozing = 7;
  // Whether the record is active.
  bool mbh_is_active = 8;
  // Optional Oracle CMBH_CHECK_STATUS — check status (Waiting/Current/Approved).
  optional string mbh_check_status = 9;
  // Optional Oracle CMBH_STATUS — head status (R and D/Spinning/Boughtout).
  optional string mbh_status = 10;
  // Optional Oracle CMBH_LDR_PRSN — LDR person value.
  optional double mbh_ldr_prsn = 11;
  // Optional Oracle CMBH_RUN_LDR_PRSN — actual LDR percentage used in production (D30: authoritative LDR for costing).
  optional double mbh_run_ldr_pct = 37;
  // Optional Oracle CMBH_FINAL_PRODUCT — final product description.
  optional string mbh_final_product = 12;
  // Optional Oracle CMBH_CODE — product code.
  optional string mbh_code = 13;
  // MB Costing Suite workflow state (mbh_entry_status). One of DRAFT/SUBMITTED/APPROVED/VALIDATED/UN_APPROVED/REVOKED/REJECTED (REJECTED added by user decision K-2).
  string entry_status = 14;
  // Whether this MB is a bought-out item (no internal spinning cost).
  bool is_boughtout = 15;
  // Audit metadata.
  common.v1.AuditInfo audit = 16;
  // Current composition version number (incremented on each validation).
  int32 current_version = 17;
  // Total fixed machine cost. NUMERIC(20,6) as string.
  string machine_fixed_total = 18;
  // Free-text reason captured on the most recent state transition.
  string state_reason = 19;
  // Development code.
  string dev_code = 20;
  // Shade code.
  string shade_code = 21;
  // Shade name.
  string shade_name = 22;
  // Cross-section descriptor.
  string cross_section = 23;
  // Lusture code (references MbLusture.code).
  string lusture_code = 24;
  // Generated cost-product ID once costing has been produced.
  int64 cost_product_id = 25;
  // Timestamp when cost was last generated.
  string cost_generated_at = 26;
  // User who last generated the cost.
  string cost_generated_by = 27;
  // Frozen param snapshot at VALIDATED — waste parameter value (mirrors mst_mb_param).
  string param_waste = 28;
  // Frozen param snapshot at VALIDATED — quality loss parameter value.
  string param_quality_loss = 29;
  // Frozen param snapshot at VALIDATED — efficiency parameter value.
  string param_efficiency = 30;
  // Frozen param snapshot at VALIDATED — development expense parameter value.
  string param_dev_expense = 31;
  // Frozen param snapshot at VALIDATED — packing parameter value.
  string param_packing = 32;
  // Frozen param snapshot at VALIDATED — MB production per day parameter value.
  string param_mb_prod_per_day = 33;
  // Frozen param snapshot at VALIDATED — throughput per hour; stores option code, e.g. "B".
  string param_throughput_per_hour = 34;
  // Frozen param snapshot at VALIDATED — number of process; stores option code, e.g. "D".
  string param_no_of_process = 35;
  // Machine assigned for MACHINE_MB_FIXED_TOTAL cost resolution (references mst_machine.mc_id). Optional.
  optional string machine_id = 36 [(buf.validate.field).string.uuid = true];
  // Optional VS number (free text, e.g. "NA"). Wired from existing column mbh_vs_number.
  optional string mbh_vs_number = 38;
  // Optional number-of-process option code: "S", "D" or "T". No default is implied — absent means NULL.
  optional string mbh_no_of_process = 39;
  // Additional shades (max 2). Combined with the header shade this yields up to 3 shades per recipe.
  repeated MBHeadShade additional_shades = 40;
  // Whether the record is locked. Field only — lock/unlock BEHAVIOUR is out of scope here (P10).
  optional bool mbh_is_locked = 41;
  // Timestamp when an unlock was requested (RFC3339). Field only — behaviour is P10.
  optional string mbh_unlock_requested_at = 42;
  // User who requested the unlock. Field only — behaviour is P10.
  optional string mbh_unlock_requested_by = 43;
  // DERIVED check status (mbh_check_status_calc), computed by the backend from
  // mbh_entry_status + mbh_is_boughtout. User decision K-1 option 2: the legacy
  // mbh_check_status (field 9) stays FROZEN as the Oracle import trace and is never
  // written by the application; THIS field is the computed one.
  // ABSENT means "never calculated by the application" — 207 legacy heads keep it
  // absent permanently, there is no backfill. Clients MUST render that explicitly
  // (e.g. "Belum dihitung"); they MUST NOT coerce it to "" or to a placeholder that
  // reads as a stored value, and they MUST NOT compute it themselves.
  optional string mbh_check_status_calc = 44;
  // Reason WRITTEN BY THE REQUESTER when calling RequestUnlockMBHead, i.e. the
  // free-text justification for why the locked recipe needs to be reopened.
  // Persisted in mst_mb_head.mbh_unlock_reason.
  //
  // ABSENT means no unlock request has ever been recorded for this head. It is
  // deliberately NOT cleared when an unlock is granted or rejected — the trail of
  // why the unlock was asked for must survive the decision.
  //
  // Rendered next to mbh_unlock_requested_by (43) and mbh_unlock_requested_at (42)
  // so the approver sees WHO asked, WHEN, and WHY before deciding.
  //
  // ⛔ This is NOT state_reason. state_reason carries the reason of the PREVIOUS
  // workflow step (principle U-2) and is left untouched by RequestUnlockMBHead —
  // never substitute one for the other.
  optional string mbh_unlock_reason = 45;
  // Oracle Orion item code (VARCHAR(200), optional; empty = none).
  string mbh_orion_item_code = 46;
  // FG (finished-goods) product link, cost_product_master id (0 = not linked). mb-spin-fg-poy-link.
  int64 fg_product_id = 47;
  // FG product ERP item code (read-only, denormalized).
  string fg_item_code = 48;
  // FG product code (read-only, denormalized).
  string fg_product_code = 49;
  // FG product name (read-only, denormalized).
  string fg_product_name = 50;
  // UUID of the newer head that superseded this one (empty = not superseded).
  string superseded_by_head_id = 51;
  // Timestamp when superseded (empty = not superseded).
  string superseded_at = 52;
}

// CreateMBHeadRequest is the request for creating an MB Head record.
message CreateMBHeadRequest {
  // Batch cost code (max 100 chars).
  string mbh_mb_costing = 1 [(buf.validate.field).string = {
    min_len: 1
