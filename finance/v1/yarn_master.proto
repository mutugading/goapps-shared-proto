// MBHeadService manages Melange Batch head master data (MEL yarn type only).
service MBHeadService {
  // CreateMBHead creates a new MB Head record.
  rpc CreateMBHead(CreateMBHeadRequest) returns (CreateMBHeadResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/mb-heads"
      body: "*"
    };
  }
  // GetMBHead retrieves an MB Head record by ID.
  rpc GetMBHead(GetMBHeadRequest) returns (GetMBHeadResponse) {
    option (google.api.http) = {get: "/api/v1/finance/mb-heads/{mbh_id}"};
  }
  // ListMBHeads lists MB Head records with search, filter, and pagination.
  rpc ListMBHeads(ListMBHeadsRequest) returns (ListMBHeadsResponse) {
    option (google.api.http) = {get: "/api/v1/finance/mb-heads"};
  }
  // UpdateMBHead updates an existing MB Head record.
  rpc UpdateMBHead(UpdateMBHeadRequest) returns (UpdateMBHeadResponse) {
    option (google.api.http) = {
      put: "/api/v1/finance/mb-heads/{mbh_id}"
      body: "*"
    };
  }
  // DeleteMBHead soft-deletes an MB Head record.
  rpc DeleteMBHead(DeleteMBHeadRequest) returns (DeleteMBHeadResponse) {
    option (google.api.http) = {delete: "/api/v1/finance/mb-heads/{mbh_id}"};
  }
  // ExportMBHeads exports MB Head records to Excel.
  rpc ExportMBHeads(ExportMBHeadsRequest) returns (ExportMBHeadsResponse) {
    option (google.api.http) = {get: "/api/v1/finance/mb-heads/export"};
  }
  // ExportMBRecipeFull exports the denormalized full MB recipe (recipe + composition
  // + MB cost) to Excel, one row per composition line.
  rpc ExportMBRecipeFull(ExportMBRecipeFullRequest) returns (ExportMBRecipeFullResponse) {
    option (google.api.http) = {get: "/api/v1/finance/mb-heads/export-full"};
  }
  // ExportMBCostCalcDetail exports the flat MB cost-calculation detail dump
  // (29 columns) to Excel, one row per (MB head, RM line) from the persisted
  // cst_product_cost snapshot. Separate from ExportMBRecipeFull by design.
  rpc ExportMBCostCalcDetail(ExportMBCostCalcDetailRequest) returns (ExportMBCostCalcDetailResponse) {
    option (google.api.http) = {get: "/api/v1/finance/mb-heads/export-cost-calc-detail"};
  }
  // ImportMBHeads imports MB Head records from Excel.
  rpc ImportMBHeads(ImportMBHeadsRequest) returns (ImportMBHeadsResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/mb-heads/import"
      body: "*"
    };
  }
  // DownloadMBHeadTemplate downloads the Excel import template.
  rpc DownloadMBHeadTemplate(DownloadMBHeadTemplateRequest) returns (DownloadMBHeadTemplateResponse) {
    option (google.api.http) = {get: "/api/v1/finance/mb-heads/template"};
  }
  // SubmitMBHead submits an MB Head for approval.
  rpc SubmitMBHead(SubmitMBHeadRequest) returns (SubmitMBHeadResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/mb-heads/{mbh_id}/submit"
      body: "*"
    };
  }
  // ApproveMBHead approves a submitted MB Head.
  rpc ApproveMBHead(ApproveMBHeadRequest) returns (ApproveMBHeadResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/mb-heads/{mbh_id}/approve"
      body: "*"
    };
  }
  // ValidateMBHead validates an approved MB Head, freezing its cost and param snapshot.
  rpc ValidateMBHead(ValidateMBHeadRequest) returns (ValidateMBHeadResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/mb-heads/{mbh_id}/validate"
      body: "*"
    };
  }
  // UnApproveMBHead reverts an approved MB Head back to a prior state.
  rpc UnApproveMBHead(UnApproveMBHeadRequest) returns (UnApproveMBHeadResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/mb-heads/{mbh_id}/unapprove"
      body: "*"
    };
  }
  // RevokeMBHead revokes an MB Head.
  rpc RevokeMBHead(RevokeMBHeadRequest) returns (RevokeMBHeadResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/mb-heads/{mbh_id}/revoke"
      body: "*"
    };
  }
  // RejectMBHead rejects a submitted MB Head (K-2). Reason is required.
  rpc RejectMBHead(RejectMBHeadRequest) returns (RejectMBHeadResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/mb-heads/{mbh_id}/reject"
      body: "*"
    };
  }
  // ReturnMBHeadToDraft returns a rejected MB Head back to draft (K-29). Reason is optional; when empty the existing state_reason is preserved.
  rpc ReturnMBHeadToDraft(ReturnMBHeadToDraftRequest) returns (ReturnMBHeadToDraftResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/mb-heads/{mbh_id}/return-to-draft"
      body: "*"
    };
  }
  // UnrevokeMBHead returns a revoked MB Head back to draft. Reason is optional; when empty the existing state_reason is preserved.
  rpc UnrevokeMBHead(UnrevokeMBHeadRequest) returns (UnrevokeMBHeadResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/mb-heads/{mbh_id}/unrevoke"
      body: "*"
    };
  }
  // RequestUnlockMBHead parks a locked MB Head (APPROVED/VALIDATED) in UNLOCK_REQUESTED
  // so an approver can decide (P10). Reason is REQUIRED — an unlock reopens content that
  // was already approved, so the record must say why.
  rpc RequestUnlockMBHead(RequestUnlockMBHeadRequest) returns (RequestUnlockMBHeadResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/mb-heads/{mbh_id}/request-unlock"
      body: "*"
    };
  }
  // GrantUnlockMBHead approves a pending unlock request: the MB Head is unlocked and
  // returns to DRAFT for editing (P10).
  rpc GrantUnlockMBHead(GrantUnlockMBHeadRequest) returns (GrantUnlockMBHeadResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/mb-heads/{mbh_id}/grant-unlock"
      body: "*"
    };
  }
  // RejectUnlockMBHead refuses a pending unlock request: the MB Head stays locked and
  // returns to the state it was parked from (P10, K-52). Reason is REQUIRED.
  rpc RejectUnlockMBHead(RejectUnlockMBHeadRequest) returns (RejectUnlockMBHeadResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/mb-heads/{mbh_id}/reject-unlock"
      body: "*"
    };
  }
  // BulkForceUnvalidateMBHead force-transitions up to 500 MB Heads from VALIDATED
  // directly back to DRAFT in one step, bypassing the normal two-step
  // RequestUnlockMBHead/GrantUnlockMBHead flow. Intended for Super Admin bulk
  // re-triggering of the validate lifecycle. Runs asynchronously via a job: the
  // response returns immediately with job info while the per-item work happens in
  // a background worker — poll GetBulkMBHeadJobStatus for progress.
  rpc BulkForceUnvalidateMBHead(BulkForceUnvalidateMBHeadRequest) returns (BulkForceUnvalidateMBHeadResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/mb-heads/bulk-unvalidate"
      body: "*"
    };
  }
  // BulkSubmitMBHead submits up to 500 MB Heads for approval in one request. Runs
  // asynchronously via a job: the response returns immediately with job info while
  // the per-item work happens in a background worker — poll GetBulkMBHeadJobStatus
  // for progress.
  rpc BulkSubmitMBHead(BulkSubmitMBHeadRequest) returns (BulkSubmitMBHeadResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/mb-heads/bulk-submit"
      body: "*"
    };
  }
  // BulkValidateMBHead validates up to 500 approved MB Heads in one request,
  // freezing each one's cost and param snapshot. Runs asynchronously via a job: the
  // response returns immediately with job info while the per-item work happens in
  // a background worker — poll GetBulkMBHeadJobStatus for progress.
  rpc BulkValidateMBHead(BulkValidateMBHeadRequest) returns (BulkValidateMBHeadResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/mb-heads/bulk-validate"
      body: "*"
    };
  }
  // GetBulkMBHeadJobStatus polls the live status and progress counters of a bulk
  // MB Head lifecycle job (BulkForceUnvalidateMBHead, BulkSubmitMBHead, or
  // BulkValidateMBHead) while it is still running.
  rpc GetBulkMBHeadJobStatus(GetBulkMBHeadJobStatusRequest) returns (GetBulkMBHeadJobStatusResponse) {
    option (google.api.http) = {get: "/api/v1/finance/mb-heads/bulk-jobs/{job_id}/status"};
  }
  // ListBulkMBHeadJobFailures lists the per-item failures recorded by a finished
  // (or in-progress) bulk MB Head lifecycle job, so the caller can see which MB
  // Heads failed and why.
  rpc ListBulkMBHeadJobFailures(ListBulkMBHeadJobFailuresRequest) returns (ListBulkMBHeadJobFailuresResponse) {
    option (google.api.http) = {get: "/api/v1/finance/mb-heads/bulk-jobs/{job_id}/failures"};
  }

  // PreviewMBHeadSupersede previews which older spins/heads/products a Validate would supersede.
  rpc PreviewMBHeadSupersede(PreviewMBHeadSupersedeRequest) returns (PreviewMBHeadSupersedeResponse) {
    option (google.api.http) = {get: "/api/v1/finance/mb-heads/{mbh_id}/supersede-preview"};
  }
}

