// Machine represents a yarn machine master record.
message Machine {
  // UUID primary key.
  string machine_id = 1;
  // Unique machine code. Immutable after creation.
  string machine_code = 2;
  // Display name.
  string machine_name = 3;
  // Machine type (DTY, POY, FDY, etc.).
  string mc_type = 4;
  // Physical location (plant/building/floor).
  string mc_location = 5;
  // Number of spindle positions.
  int32 no_of_position = 6;
  // Number of ends per position.
  int32 no_of_end = 7;
  // Machine speed in m/min.
  double mc_speed = 8;
  // Optional machine RPM.
  optional double machine_rpm = 9;
  // Machine efficiency as a percentage (default 95).
  double mc_efficiency = 10;
  // Optional power cost per day in USD.
  optional double power_per_day = 11;
  // Whether the record is active.
  bool is_active = 12;
  // Optional notes.
  string notes = 13;
  // Optional manpower cost per day in USD.
  optional double mp_per_day = 14;
  // Optional overhead per head per day in USD.
  optional double ohs_per_day = 15;
  // Audit metadata.
  common.v1.AuditInfo audit = 16;
  // Optional spares cost per day in USD.
  optional double spares_per_day = 17;
  // Optional change-over quality loss in kgs.
  optional double kgs_lost_change = 18;
  // Optional volume bucket 1 quantity threshold.
  optional double vb1_qty = 19;
  // Optional volume bucket 2 quantity threshold.
  optional double vb2_qty = 20;
  // Optional volume bucket 3 quantity threshold.
  optional double vb3_qty = 21;
  // Optional volume bucket 4 quantity threshold.
  optional double vb4_qty = 22;
  // Optional volume bucket 5 quantity threshold.
  optional double vb5_qty = 23;
  // Optional Oracle CMM_POY_BOBBIN_WEIGHT — kg per bobbin.
  optional double mc_poy_bobbin_weight = 24;
  // Optional Oracle CMM_TOT_FXD_CST — total fixed cost.
  optional double mc_tot_fxd_cst = 25;
  // Optional Oracle CMM_BOBBIN_PER_TROLLY — bobbins per trolley.
  optional double mc_bobbin_per_trolly = 26;
  // Optional Oracle CMM_BOX_COST — box cost per unit.
  optional double mc_box_cost = 27;
  // Optional Oracle CMM_CAPTIVE_PER_BOBBIN — captive cost per bobbin.
  optional double mc_captive_per_bobbin = 28;
  // Optional Oracle CMM_WEIGHTAGE — machine weightage factor.
  optional double mc_weightage = 29;
}

