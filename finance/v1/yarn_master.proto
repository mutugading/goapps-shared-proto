// BoxBobbinCostRate represents a period-specific rate for a Box Bobbin Cost config.
message BoxBobbinCostRate {
  // UUID primary key.
  string bbcr_id = 1;
  // Parent config UUID.
  string bbcr_bbc_id = 2;
  // Period identifier (YYYYMM).
  string bbcr_period = 3;
  // Bobbin marketing rate (USD/bobbin).
  double bbcr_bob_rate_mkt = 4;
  // Box marketing rate (USD/box).
  double bbcr_box_rate_mkt = 5;
  // Optional bobbin valuation rate (falls back to mkt for ACTUAL CalcType).
  optional double bbcr_bob_rate_val = 6;
  // Optional box valuation rate (falls back to mkt for ACTUAL CalcType).
  optional double bbcr_box_rate_val = 7;
  // Audit metadata.
  common.v1.AuditInfo audit = 16;
}

// BoxBobbinCost represents a packing configuration master record.
message BoxBobbinCost {
  // UUID primary key.
  string bbc_id = 1;
  // Unique config code. Immutable after creation.
  string bbc_code = 2;
  // Display name.
  string bbc_name = 3;
  // Config type (CAPTIVE or DELIVERY).
  string bbc_type = 4;
  // Number of bobbins per box.
  int32 no_of_bob = 5;
  // Whether the record is active.
  bool is_active = 6;
  // Optional notes.
  string notes = 7;
  // Period-specific rate entries.
  repeated BoxBobbinCostRate rates = 8;
  // Optional bobbin reuse count (from Oracle CMBBC_BBN_REUSE).
  optional double bbn_reuse = 9;
  // Optional box reuse count (from Oracle CMBBC_BOX_REUSE).
  optional double box_reuse = 10;
  // Optional MKT box rate in USD/box (param CAPTIVE/DELIVERY_BOX_RATE MKT).
  optional double box_cost = 11;
  // Optional MKT bobbin rate in USD/bobbin (param CAPTIVE/DELIVERY_BOB_RATE MKT).
  optional double bobin_cost = 12;
  // Optional VAL box rate in USD/box (param CAPTIVE/DELIVERY_BOX_RATE VAL).
  optional double box_cost_val = 13;
  // Optional VAL bobbin rate in USD/bobbin (param CAPTIVE/DELIVERY_BOB_RATE VAL).
  optional double bobin_cost_val = 14;
  // Optional Oracle CMBBC_BBN_REUSE_VAL — bobbin reuse count for VAL session.
  optional double bbn_reuse_val = 15;
  // Audit metadata.
  common.v1.AuditInfo audit = 16;
  // Optional Oracle CMBBC_BOX_REUSE_VAL — box reuse count for VAL session.
  optional double box_reuse_val = 17;
}

