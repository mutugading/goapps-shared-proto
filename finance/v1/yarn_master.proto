// =============================================================================
// MESSAGES — MBDozing (read-only calculator, no persistence)
// =============================================================================

// CalculateDozingRequest is the request for the stateless dozing (LDR) calculator.
//
// Modes: SCALE and XSECTION only.
//
// NOTE — STRENGTH mode is INTENTIONALLY ABSENT from the `in:` rule below even
// though the consolidated design (§3.7) lists three modes. Decision gate G6-C3
// put STRENGTH on hold: its formula/direction semantics are not yet settled, so
// accepting the literal here would expose an RPC surface the backend cannot
// honor. This is a DELIBERATE DIVERGENCE from the design document. Field
// numbers 10, 11 and 12 are reserved below so STRENGTH can be added later
// without renumbering.
//
// NOTE — mode SCALE is computed in pure Go (math.Sqrt); mst_formula is read
// ONLY to populate formula_code and calculation_trace (decision K-16 / G19-SQRT).
message CalculateDozingRequest {
  // Reserved for the STRENGTH mode inputs (ldr_old, strength, direction).
  // Held back by gate G6-C3 — numbers must NOT be reused.
  reserved 10, 11, 12;

  // Calculation mode: SCALE or XSECTION.
  string mode = 1 [(buf.validate.field).string = {
    in: [
      "SCALE",
      "XSECTION"
    ]
  }];
  // Mode SCALE — reference LDR (dozing percentage) of the source recipe.
  optional double ldr_ref = 2;
  // Mode SCALE — reference denier, strictly greater than zero.
  optional double denier_ref = 3 [(buf.validate.field).double.gt = 0];
  // Mode SCALE — reference filament count, strictly greater than zero.
  // Enforced here as well as in the domain layer (ErrZeroFilament).
  optional int32 filament_ref = 4 [(buf.validate.field).int32.gt = 0];
  // Mode SCALE — target denier, strictly greater than zero.
  optional double denier_target = 5 [(buf.validate.field).double.gt = 0];
  // Mode SCALE — target filament count, strictly greater than zero.
  // Enforced here as well as in the domain layer (ErrZeroFilament).
  optional int32 filament_target = 6 [(buf.validate.field).int32.gt = 0];
  // Mode XSECTION — source LDR (dozing percentage).
  optional double ldr_source = 7;
  // Mode XSECTION — source cross-section code (mst_mb_cross_section.mbcs_code).
  optional string from_cross_section = 8 [(buf.validate.field).string.max_len = 10];
  // Mode XSECTION — target cross-section code (mst_mb_cross_section.mbcs_code).
  optional string to_cross_section = 9 [(buf.validate.field).string.max_len = 10];
}

// CalculateDozingResponse is the response for the dozing (LDR) calculator.
message CalculateDozingResponse {
  // Standard response metadata.
  common.v1.BaseResponse base = 1;
  // Resulting LDR. LEFT UNSET when the conversion factor is absent
  // (factor_available = false). A 1.0 fallback is explicitly forbidden.
  optional double result_ldr = 2;
  // Formula identifier, e.g. F_MB_LDR_SCALE or F_MB_LDR_XSECTION.
  string formula_code = 3;
  // Human-readable substituted expression, for calculation transparency.
  string calculation_trace = 4;
  // False when no conversion factor exists for the requested pair; the UI must
  // disable the apply action and show an explicit message.
  bool factor_available = 5;
}

// PreviewDozingImpactRequest is the request for previewing products affected by
// a dozing change. Spin path only.
message PreviewDozingImpactRequest {
  // Reserved: the direct yarn -> head path is never used by any product.
  reserved 1;
  reserved "mbh_id";

  // MB spin UUID. Required.
  string mbs_id = 2 [(buf.validate.field).string.uuid = true];
  // Maximum number of rows to return. 0 means the server default (20).
  int32 limit = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
}

// DozingImpactRow is a single product affected by a dozing change.
message DozingImpactRow {
  // Reserved: former via_param_code — always MB_SP_CODE, therefore redundant.
  reserved 5;
  reserved "via_param_code";

  // Product system ID.
  int64 cpm_product_sys_id = 1;
  // Product code.
  string cpm_product_code = 2;
  // Product name.
  string cpm_product_name = 3;
  // Whether the product costing is locked.
  bool cpm_is_locked = 4;
  // Dozing value frozen on the product, when present.
  optional double frozen_dozing = 6;
}

// PreviewDozingImpactResponse is the response for the dozing impact preview.
message PreviewDozingImpactResponse {
  // Standard response metadata.
  common.v1.BaseResponse base = 1;
  // Affected product rows (Top-N, capped by the request limit).
  repeated DozingImpactRow data = 2;
  // Total number of affected products, before truncation.
  int32 total_affected = 3;
  // Number of affected products that are locked.
  int32 total_locked = 4;
  // True when data was truncated by the limit.
  bool truncated = 5;
  // Free-form note used to report data anomalies detected while resolving impact.
  string note = 6;
}

// =============================================================================
// SERVICE — MBDozing
// =============================================================================

// MBDozingService provides read-only MB dozing (LDR) calculation and impact
// preview. No RPC in this service persists anything.
service MBDozingService {
  // CalculateDozing computes a target LDR without persisting anything.
  rpc CalculateDozing(CalculateDozingRequest) returns (CalculateDozingResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/mb-dozing/calculate"
      body: "*"
    };
  }
  // PreviewDozingImpact lists products that would be affected by a dozing change.
  rpc PreviewDozingImpact(PreviewDozingImpactRequest) returns (PreviewDozingImpactResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/mb-dozing/impact-preview"
      body: "*"
    };
  }
}

// =============================================================================
// MB Spin <-> FG/POY link: supersede preview + unsupersede (mb-spin-fg-poy-link).
// =============================================================================

// PreviewMBHeadSupersedeRequest asks what Validate of this head would supersede.
message PreviewMBHeadSupersedeRequest {
  // MB Head UUID.
  string mbh_id = 1 [(buf.validate.field).string.uuid = true];
}

// MBSupersedeFilledByCount counts affected param rows per filled_by source.
message MBSupersedeFilledByCount {
  // Param filled_by source (e.g. AUTOFILL, MANUAL, IMPORT).
  string filled_by = 1;
  // Number of rows.
  int32 count = 2;
}

// MBSupersedeAffectedProduct is a product whose MB_SP_CODE param would be repointed.
message MBSupersedeAffectedProduct {
  // cost_product_master id.
  int64 product_sys_id = 1;
  // Product code.
  string product_code = 2;
  // Product name.
  string product_name = 3;
  // Param filled_by source for this product.
  string filled_by = 4;
}

// MBSupersedeCandidate describes one old spin that would be superseded.
message MBSupersedeCandidate {
  // Old spin UUID.
  string old_spin_id = 1;
  // Old spin code.
  string old_spin_code = 2;
  // Shade code.
  string shade_code = 3;
  // FG product id (0 = none).
  int64 fg_product_id = 4;
  // FG product code.
  string fg_product_code = 5;
  // Old head UUID.
  string old_head_id = 6;
  // Old head code.
  string old_head_code = 7;
  // True if the old head would be deactivated.
  bool old_head_will_deactivate = 8;
  // Product sys id of the old MB product.
  int64 old_mb_product_sys_id = 9;
  // True if the old MB product would be deactivated.
  bool old_mb_product_will_deactivate = 10;
  // Param rows that would be repointed (pointer rows).
  int32 param_rows_pointer = 11;
  // Param rows that are text-only (not repointed).
  int32 param_rows_text_only = 12;
  // Breakdown of affected rows by filled_by.
  repeated MBSupersedeFilledByCount filled_by_counts = 13;
  // Products affected.
  repeated MBSupersedeAffectedProduct affected_products = 14;
  // Warnings (e.g. duplicated orion code text rows not repointed).
  repeated string warnings = 15;
}

// MBHeadSupersedePreview is the preview payload.
message MBHeadSupersedePreview {
  // True when the caller must pass confirm_supersede=true on Validate.
  bool requires_confirmation = 1;
  // Candidates that would be superseded.
  repeated MBSupersedeCandidate candidates = 2;
}

// PreviewMBHeadSupersedeResponse is the response for PreviewMBHeadSupersede.
message PreviewMBHeadSupersedeResponse {
  // Standard response metadata.
  common.v1.BaseResponse base = 1;
  // Preview data.
  MBHeadSupersedePreview data = 2;
}

// UnsupersedeMBSpinRequest reverts a supersede of a spin.
message UnsupersedeMBSpinRequest {
  // Parent MB Head UUID (path parameter; optional, ignored when empty).
  string mbh_id = 1 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {uuid: true}
  }];
  // Superseded MB Spin UUID.
  string mbs_id = 2 [(buf.validate.field).string.uuid = true];
}

// MBUnsupersedeSkippedParam is a param row that could not be reverted.
message MBUnsupersedeSkippedParam {
  // cost_product_param_value id.
  int64 cpp_value_id = 1;
  // Product sys id.
  int64 product_sys_id = 2;
  // Product code.
  string product_code = 3;
  // Param code.
  string param_code = 4;
  // Reason skipped.
  string reason = 5;
}

// UnsupersedeMBSpinResponse is the response for UnsupersedeMBSpin.
message UnsupersedeMBSpinResponse {
  // Standard response metadata.
  common.v1.BaseResponse base = 1;
  // Restored spin.
  MBSpin data = 2;
  // Number of param rows reverted.
  int32 params_reverted = 3;
  // Param rows skipped.
  repeated MBUnsupersedeSkippedParam skipped = 4;
}
