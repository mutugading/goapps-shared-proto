  // Source type: GROUP/MB/CARRIER.
  string source_type = 5 [(buf.validate.field).string = {
    in: [
      "GROUP",
      "MB",
      "CARRIER"
    ]
  }];
  // Referenced MB Head UUID when source_type is MB.
  string mb_ref_mbh_id = 6;
  // Whether this line represents the carrier component.
  bool is_carrier = 7;
}

