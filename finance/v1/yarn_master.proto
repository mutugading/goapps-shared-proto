// ProductGrade represents a quality-loss configuration preset.
message ProductGrade {
  // UUID primary key.
  string pg_id = 1;
  // Unique code. Immutable after creation.
  string pg_code = 2;
  // Display name.
  string pg_name = 3;
  // Optional description.
  string pg_description = 4;
  // Percentage output as BC grade.
  double bc_perc = 5;
  // Percentage output as Non-Standard.
  double non_std_perc = 6;
  // Percentage of value recovered from BC grade.
  double bc_recovery_rate = 7;
  // Whether the record is active.
  bool is_active = 8;
  // Optional notes.
  string notes = 9;
  // Pattern match key (e.g., "DBR <=600D").
  string pg_detail_product = 10;
  // Display grade label (informational; no longer copied to a cost param —
  // products reference the grade by pg_code via NS_LOSS_TYPE / BC_LOSS_TYPE).
  string pg_grade_label = 11;
  // Standard selling price; auto-fills param STD_SP_AX.
  double std_selling_price = 12;
  // BC selling price; auto-fills param STD_SP_BC via BC_LOSS_TYPE
  // (BC V-Loss = (cost before QLoss − STD_SP_BC) × (B+C) / 100).
  double sp_value = 13;
  // Optional NS loss factor (from Oracle CMPG_LOSS); auto-fills param NS_LOSS via
  // NS_LOSS_TYPE (NS V-Loss = (AE + A9 + A) / 100 × NS_LOSS).
  optional double loss_pct = 14;
  // Optional display sequence number (from Oracle CMPG_SEQ_NO).
  optional int32 seq_no = 15;
  // Audit metadata.
  common.v1.AuditInfo audit = 16;
}

