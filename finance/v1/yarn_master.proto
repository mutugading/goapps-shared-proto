  // Page size (1-100).
  int32 page_size = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  // Full-text search across mgt_name and mb_costing.
  string search = 4 [(buf.validate.field).string.max_len = 100];
  // Filter by active status.
  ActiveFilter active_filter = 5;
  // Sort field.
  string sort_by = 6 [(buf.validate.field).string = {
    in: [
      "",
      "mbs_mgt_name",
      "mbs_denier",
      "created_at"
    ]
  }];
  // Sort direction.
  string sort_order = 7 [(buf.validate.field).string = {
    in: [
      "",
      "asc",
      "desc"
    ]
  }];
  // Filter by FG product id. 0 = no filter.
  int64 fg_product_id = 8 [(buf.validate.field).int64.gte = 0];
  // Search by FG product code / name / orion item code (max 200 chars).
  string fg_search = 9 [(buf.validate.field).string.max_len = 200];
  // Include superseded spins. NOTE: default behaviour is unchanged (superseded spins are
  // still listed as before); this flag is reserved for explicit callers.
