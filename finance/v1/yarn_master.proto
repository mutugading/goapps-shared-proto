// =============================================================================
// MESSAGES — MB_BATCH cost calc trigger
// =============================================================================

// TriggerMbBatchRequest is the request to compute cst_product_cost rows for every
// VALIDATED MB Head, for the given period, across all 3 calculation types.
message TriggerMbBatchRequest {
  // Period in YYYYMM format.
  string period = 1 [(buf.validate.field).string.pattern = "^[0-9]{6}$"];
}

// MbBatchError records one MB Head's compute failure within a batch run.
message MbBatchError {
  // MB Head UUID.
  string mbh_id = 1;
  // Failure detail.
  string error = 2;
}

// TriggerMbBatchResponse summarizes an MB_BATCH run's outcome.
message TriggerMbBatchResponse {
  // Standard response metadata.
  common.v1.BaseResponse base = 1;
  // Underlying cal_job id created for this run.
  int64 job_id = 2;
  // Period computed, in YYYYMM format.
  string period = 3;
  // Count of MB Heads successfully computed.
  int32 success_count = 4;
  // Count of MB Heads that failed to compute.
  int32 failed_count = 5;
  // Total cst_product_cost rows inserted (3 per successful MB Head).
  int32 rows_inserted = 6;
  // Wall-clock duration of the run, in milliseconds.
  int64 duration_ms = 7;
  // Per-MB failure details, one entry per failed MB Head.
  repeated MbBatchError errors = 8;
}

// =============================================================================
// SERVICE — MbBatch
// =============================================================================

// MbBatchService triggers the MB_BATCH cost calculation orchestration.
service MbBatchService {
  // TriggerMbBatch computes cst_product_cost rows for every VALIDATED MB Head for a period.
  rpc TriggerMbBatch(TriggerMbBatchRequest) returns (TriggerMbBatchResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/mb-batch/trigger"
      body: "*"
    };
  }
}

// =============================================================================
// MESSAGES — MB Cross Section (master) + MB Cross Section Factor (directed pairs)
// =============================================================================

// MbCrossSection is a master lookup entry for MB cross-section codes
// (mst_mb_cross_section).
message MbCrossSection {
  // UUID primary key (mbcs_id).
  string mbcs_id = 1;
  // Unique cross-section code (mbcs_code, max 10 chars), e.g. RND / TBL / RSD.
  string code = 2;
  // Display name (mbcs_display_name).
  string display_name = 3;
  // Free-text description (mbcs_description).
  string description = 4;
  // Whether the record is active (mbcs_is_active).
  bool is_active = 5;
  // Display ordering hint (mbcs_display_order).
  int32 display_order = 6;
  // Audit metadata.
  common.v1.AuditInfo audit = 7;
}

// MbCrossSectionFactor is one ORDERED (from_code -> to_code) LDR conversion
// factor (mst_mb_cross_section_factor). The operation carries the direction of
// the arithmetic and is not derivable from the factor alone.
message MbCrossSectionFactor {
  // UUID primary key (mbcf_id).
  string mbcf_id = 1;
  // Source cross-section code (mbcf_from_code).
  string from_code = 2;
  // Target cross-section code (mbcf_to_code).
  string to_code = 3;
  // Conversion factor (mbcf_factor), strictly greater than zero.
  double factor = 4;
  // Arithmetic direction (mbcf_operation): MULTIPLY or DIVIDE.
  string operation = 5;
  // Free-text note (mbcf_note).
  string note = 6;
  // Whether the record is active (mbcf_is_active).
  bool is_active = 7;
  // Audit metadata.
  common.v1.AuditInfo audit = 8;
}

// CreateMbCrossSectionRequest is the request for creating an MB cross-section master record.
message CreateMbCrossSectionRequest {
  // Unique cross-section code (1-10 chars).
  string code = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 10
  }];
  // Display name.
  string display_name = 2 [(buf.validate.field).string.max_len = 50];
  // Free-text description.
  string description = 3 [(buf.validate.field).string.max_len = 200];
  // Whether the record is active.
  bool is_active = 4;
  // Display ordering hint.
  int32 display_order = 5;
}

