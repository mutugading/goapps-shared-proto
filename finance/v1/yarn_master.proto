// DuplicateMBSpinRequest is the request for duplicating an MB Spin record.
//
// Shape follows design §3.7. mbs_oracle_sys_id, mbs_orion_item_code and
// mbs_mb_costing are DELIBERATELY ABSENT: decision D19 requires all three to be
// NULL on the clone, so there is no field to carry them. The user fills them in
// afterwards via UpdateMBSpin.
message DuplicateMBSpinRequest {
  // Parent MB Head UUID.
  string mbh_id = 1 [(buf.validate.field).string.uuid = true];
  // Source MB Spin UUID — the record being duplicated.
  string mbs_id = 2 [(buf.validate.field).string.uuid = true];
  // Optional override for the clone's management display name (max 100 chars).
  // Absent means the server derives it as "<source name> (copy)".
  optional string mbs_mgt_name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  // Optional override for the clone's denier, strictly greater than zero.
  // Absent means the source value is copied as-is.
  //
  // NOTE — the > 0 rule is INTENTIONALLY STRICTER than CreateMBSpinRequest /
  // UpdateMBSpinRequest, which accept any double. This field is never a
  // passthrough of stored legacy data: it exists only to carry a value a user
  // just typed into the duplicate dialog, and a zero/negative denier there is
  // always a mistake. Legacy rows keep flowing through Create/Update untouched.
  optional double mbs_denier = 4 [(buf.validate.field).double.gt = 0];
  // Optional override for the clone's filament count, strictly greater than
  // zero. Absent means the source value is copied as-is. Same stricter-than-
  // Create/Update reasoning as mbs_denier above.
  optional int32 mbs_filament = 5 [(buf.validate.field).int32.gt = 0];
  // FG product link for the clone (cost_product_master id). 0 = not set / inherit.
  int64 fg_product_id = 6 [(buf.validate.field).int64.gte = 0];
}

// MBSpinRecalcSkipped is one child spin that the duplicate/recalc pass did NOT
// touch (rule A7).
//
// Children are recalculated only when mbs_status = 'R and D'. A child in
// 'Spinning' or 'Boughtout', or one whose status is absent, carries an actual
// production value that must never be overwritten by a derived one — it is
// skipped and reported here so the UI can say WHICH children were left alone
// and why, instead of silently doing less than the user expected.
message MBSpinRecalcSkipped {
  // Skipped child spin UUID.
  string mbs_id = 1;
  // Skipped child spin management display name, for display without a refetch.
  string mbs_mgt_name = 2;
  // Status that caused the skip. Absent = the child has no status at all, which
  // is itself a skip reason (an absent status is treated as non-recalculable).
  optional string mbs_status = 3;
  // Machine-readable skip reason, e.g. STATUS_NOT_RND or STATUS_ABSENT.
  string reason = 4;
}

// DuplicateMBSpinResponse is the response for duplicating an MB Spin record.
//
// ⚠ The impact_* fields are a PREVIEW ONLY (decision D24). Nothing in this
// response is the result of a yarn-product recalculation: duplicating a spin
// NEVER recalculates yarn products. The rows only tell the user which products
// would be affected, so they can decide what to do next.
message DuplicateMBSpinResponse {
  // Standard response metadata.
  common.v1.BaseResponse base = 1;
  // The newly created clone.
  MBSpin data = 2;
  // Child spins deliberately left untouched by the recalc pass (rule A7).
  // Empty when every candidate child was recalculated.
  repeated MBSpinRecalcSkipped skipped = 3;
  // Number of skipped child spins. Equals len(skipped) — sent explicitly so a
  // caller that ignores the detail rows still gets the count.
  int32 skipped_count = 4;
  // Products that WOULD be affected, Top-N. ⛔ NOT a recalculation result (D24).
  // Reuses DozingImpactRow, the same row type PreviewDozingImpact returns, so
  // the UI can render both with one component.
  repeated DozingImpactRow impact_preview = 5;
  // Total number of affected products, before truncation.
  int32 impact_total_affected = 6;
  // Number of affected products whose costing is locked.
  int32 impact_total_locked = 7;
  // True when impact_preview was truncated by the server's row cap.
  bool impact_truncated = 8;
}

// =============================================================================
// MESSAGES — Yarn Lookup Fill (auto-populate CAPP from master selection)
// =============================================================================

// GetLookupFillValuesRequest requests auto-fill values from a master lookup selection.
message GetLookupFillValuesRequest {
  // lookup_master_code from mst_parameter.lookup_master_code.
  // Valid values: "MACHINE" | "INTERMINGLING" | "PRODUCT_GRADE" | "MB_HEAD" | "BOX_BOBBIN_COST"
  string lookup_master_code = 1 [(buf.validate.field).string.min_len = 1];
  // Key of the selected master record (e.g., mc_code, intm_code, pg_code, mbh_mb_costing, bbc_code).
  string selected_key = 2 [(buf.validate.field).string.min_len = 1];
  // Source param code that triggered the lookup — used to resolve CAP vs DEL variant for BOX_BOBBIN_COST.
  // Optional; required only for BOX_BOBBIN_COST.
  string source_param_code = 3;
}

// GetLookupFillValuesResponse returns numeric and text fills to auto-populate CAPP params.
message GetLookupFillValuesResponse {
  common.v1.BaseResponse base = 1;
  // param_code → numeric value to fill (e.g., {"MC_SPEED": 800.0, "MC_EFFICIENCY": 92.0}).
  map<string, double> numeric_fills = 2;
  // param_code → text value to fill (e.g., {"MB_DYE_NAME": "CIBA RED"}).
  map<string, string> text_fills = 3;
  // Human-readable label for UI toast (e.g., "Barmag DTY Line D — 504 pos, 800 m/min").
  string display_label = 4;
}

// =============================================================================
// SERVICES
// =============================================================================

// MachineService manages yarn machine master data.
service MachineService {
  // CreateMachine creates a new machine record.
  rpc CreateMachine(CreateMachineRequest) returns (CreateMachineResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/machines"
      body: "*"
    };
  }
  // GetMachine retrieves a machine by ID.
  rpc GetMachine(GetMachineRequest) returns (GetMachineResponse) {
    option (google.api.http) = {get: "/api/v1/finance/machines/{machine_id}"};
  }
  // ListMachines lists machine records with search, filter, and pagination.
  rpc ListMachines(ListMachinesRequest) returns (ListMachinesResponse) {
    option (google.api.http) = {get: "/api/v1/finance/machines"};
  }
  // UpdateMachine updates an existing machine record.
  rpc UpdateMachine(UpdateMachineRequest) returns (UpdateMachineResponse) {
    option (google.api.http) = {
      put: "/api/v1/finance/machines/{machine_id}"
      body: "*"
    };
  }
  // DeleteMachine soft-deletes a machine record.
  rpc DeleteMachine(DeleteMachineRequest) returns (DeleteMachineResponse) {
    option (google.api.http) = {delete: "/api/v1/finance/machines/{machine_id}"};
  }
  // ExportMachines exports machine records to Excel.
  rpc ExportMachines(ExportMachinesRequest) returns (ExportMachinesResponse) {
    option (google.api.http) = {get: "/api/v1/finance/machines/export"};
  }
  // ImportMachines imports machine records from Excel.
  rpc ImportMachines(ImportMachinesRequest) returns (ImportMachinesResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/machines/import"
      body: "*"
    };
  }
  // DownloadMachineTemplate downloads the Excel import template.
  rpc DownloadMachineTemplate(DownloadMachineTemplateRequest) returns (DownloadMachineTemplateResponse) {
    option (google.api.http) = {get: "/api/v1/finance/machines/template"};
  }
}

// BoxBobbinCostService manages packing configuration and period-specific rates.
service BoxBobbinCostService {
  // CreateBoxBobbinCost creates a new packing config.
  rpc CreateBoxBobbinCost(CreateBoxBobbinCostRequest) returns (CreateBoxBobbinCostResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/box-bobbin-costs"
      body: "*"
    };
  }
  // GetBoxBobbinCost retrieves a config by ID (includes rates).
  rpc GetBoxBobbinCost(GetBoxBobbinCostRequest) returns (GetBoxBobbinCostResponse) {
    option (google.api.http) = {get: "/api/v1/finance/box-bobbin-costs/{bbc_id}"};
  }
  // ListBoxBobbinCosts lists configs with search, filter, and pagination.
  rpc ListBoxBobbinCosts(ListBoxBobbinCostsRequest) returns (ListBoxBobbinCostsResponse) {
    option (google.api.http) = {get: "/api/v1/finance/box-bobbin-costs"};
  }
  // UpdateBoxBobbinCost updates an existing config.
  rpc UpdateBoxBobbinCost(UpdateBoxBobbinCostRequest) returns (UpdateBoxBobbinCostResponse) {
    option (google.api.http) = {
      put: "/api/v1/finance/box-bobbin-costs/{bbc_id}"
      body: "*"
    };
