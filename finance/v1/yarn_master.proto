}

// =============================================================================
// MESSAGES — MB Spin
// =============================================================================

// MBSpin represents a Melange Batch spin detail record (child of MBHead).
message MBSpin {
  // UUID primary key.
  string mbs_id = 1;
  // Oracle PK for import reconciliation (optional).
  string mbs_oracle_sys_id = 2;
  // Parent MB Head UUID.
  string mbs_mbh_id = 3;
  // Management display name.
  string mbs_mgt_name = 4;
  // Spin denier (dtex). Optional.
  optional double mbs_denier = 5;
  // Number of filaments. Optional.
  optional int32 mbs_filament = 6;
  // Spin dozing percentage. Optional.
  optional double mbs_dozing = 7;
  // Spin cost code / identifier. Optional.
  string mbs_mb_costing = 8;
  // Whether the record is active.
  bool mbs_is_active = 9;
  // Optional MB/SP cost code.
  optional string mbs_cc = 10;
  // Optional MB rate MKT in USD/kg.
  optional double mbs_cost_rate_mkt = 11;
  // Optional Oracle CMBS_STATUS — spinning status (Spinning/R and D/Boughtout).
  optional string mbs_status = 12;
  // Optional Oracle CMBS_LDR_PRSN — LDR person value.
  optional double mbs_ldr_prsn = 13;
  // Optional Oracle CMBS_FINAL_PRODUCT — final product description.
  optional string mbs_final_product = 14;
  // Optional Oracle CMBS_RUN_LDR_PRSN — actual LDR percentage used in production (D30: authoritative LDR for costing).
  optional double mbs_run_ldr_pct = 15;
  // Audit metadata.
  common.v1.AuditInfo audit = 16;
  // Fix/actual marker for the LDR value. Absent means "unknown", which the
  // domain treats as FIXED (recalc-safe). true = fixed, false = computed.
  optional bool mbs_ldr_is_fixed = 17;
  // Fix/actual marker for the dozing value. Absent means "unknown", which the
  // domain treats as FIXED (recalc-safe). true = fixed, false = computed.
  optional bool mbs_dozing_is_fixed = 18;
  // Current LDR provenance: NOT_CALCULATED, CALCULATED, or ACTUAL. Mirrors mbs_ldr_type.
  string mbs_ldr_type = 19;
  // System-calculated LDR percentage, before any manual adjustment. Mirrors mbs_ldr_calculated_pct.
  optional double mbs_ldr_calculated_pct = 20;
  // Manual adjustment added on top of the calculated LDR. Mirrors mbs_ldr_adjustment_pct.
  optional double mbs_ldr_adjustment_pct = 21;
  // True when the LDR is locked to an actual/manual value (mbs_ldr_type is then ACTUAL). Mirrors mbs_ldr_is_actual.
  bool mbs_ldr_is_actual = 22;
  // Optional Oracle CMBS_VS_NUMBER — VS reference number, copied from the parent MB Head's mbh_vs_number.
  optional string mbs_vs_number = 23 [(buf.validate.field).string.max_len = 50];
  // Shade code, copied down from MB Head at auto-gen. Read-only lineage field.
  string mbs_shade_code = 24;
  // Shade name, copied down from MB Head at auto-gen. Read-only lineage field.
  string mbs_shade_name = 25;
  // Cross section, copied down from MB Head at auto-gen. Read-only lineage field.
  string mbs_cross_section = 26;
  // Oracle Orion item code (output-only, read-only; inherited from head when empty).
  string mbs_orion_item_code = 27;
  // FG product link, cost_product_master id (0 = not linked). mb-spin-fg-poy-link.
  int64 fg_product_id = 28;
  // FG product ERP item code (read-only, denormalized).
  string fg_item_code = 29;
  // FG product code (read-only, denormalized).
  string fg_product_code = 30;
  // FG product name (read-only, denormalized).
  string fg_product_name = 31;
  // How the FG link was derived (e.g. FG_MATCH | SHADE_ONLY | MANUAL; empty = none).
  string fg_link_source = 32;
  // UUID of the spin that superseded this one (empty = not superseded).
  string superseded_by_spin_id = 33;
  // Timestamp when superseded (empty = not superseded).
  string superseded_at = 34;
  // Code of the superseding spin (convenience for the "Superseded -> <code>" badge).
  string superseded_by_spin_code = 35;
}

// CreateMBSpinRequest is the request for creating an MB Spin record.
message CreateMBSpinRequest {
  // Parent MB Head UUID.
  string mbh_id = 1 [(buf.validate.field).string.uuid = true];
  // Management display name (max 100 chars).
  string mbs_mgt_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  // Optional Oracle sys ID (max 30 chars).
  optional string mbs_oracle_sys_id = 3 [(buf.validate.field).string.max_len = 30];
  // Optional spin denier.
  optional double mbs_denier = 4;
  // Optional number of filaments.
  optional int32 mbs_filament = 5;
  // Optional spin dozing percentage.
  optional double mbs_dozing = 6;
  // Optional spin cost code (max 100 chars).
  optional string mbs_mb_costing = 7 [(buf.validate.field).string.max_len = 100];
  // Optional MB/SP cost code (max 100 chars).
  optional string mbs_cc = 8 [(buf.validate.field).string.max_len = 100];
  // Optional MB rate MKT in USD/kg.
  optional double mbs_cost_rate_mkt = 9;
  // Optional Oracle CMBS_STATUS (max 100 chars).
  optional string mbs_status = 10 [(buf.validate.field).string.max_len = 100];
  // Optional Oracle CMBS_LDR_PRSN (≥ 0).
  optional double mbs_ldr_prsn = 11 [(buf.validate.field).double.gte = 0];
  // Optional Oracle CMBS_FINAL_PRODUCT (max 200 chars).
  optional string mbs_final_product = 12 [(buf.validate.field).string.max_len = 200];
  // Optional Oracle CMBS_RUN_LDR_PRSN — actual LDR percentage (≥ 0).
  optional double mbs_run_ldr_pct = 13 [(buf.validate.field).double.gte = 0];
  // Optional fix/actual marker for LDR. Absent = unknown (treated as fixed).
  optional bool mbs_ldr_is_fixed = 14;
  // Optional fix/actual marker for dozing. Absent = unknown (treated as fixed).
  optional bool mbs_dozing_is_fixed = 15;
  // Optional VS reference number (free text, e.g. "NA").
  optional string mbs_vs_number = 16 [(buf.validate.field).string.max_len = 50];
}

// CreateMBSpinResponse is the response for creating an MB Spin record.
message CreateMBSpinResponse {
  // Standard response metadata.
  common.v1.BaseResponse base = 1;
  // Created MB Spin data.
  MBSpin data = 2;
}

// GetMBSpinRequest is the request for retrieving an MB Spin record by ID.
message GetMBSpinRequest {
  // Parent MB Head UUID.
  string mbh_id = 1 [(buf.validate.field).string.uuid = true];
  // MB Spin UUID.
  string mbs_id = 2 [(buf.validate.field).string.uuid = true];
}

// GetMBSpinResponse is the response for retrieving an MB Spin record.
message GetMBSpinResponse {
  // Standard response metadata.
  common.v1.BaseResponse base = 1;
  // MB Spin data.
  MBSpin data = 2;
}

// UpdateMBSpinRequest is the request for updating an MB Spin record.
message UpdateMBSpinRequest {
  // Parent MB Head UUID.
  string mbh_id = 1 [(buf.validate.field).string.uuid = true];
  // MB Spin UUID.
  string mbs_id = 2 [(buf.validate.field).string.uuid = true];
  // Updated management display name (max 100 chars).
  optional string mbs_mgt_name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  // Updated spin denier.
  optional double mbs_denier = 4;
  // Updated number of filaments.
  optional int32 mbs_filament = 5;
  // Updated spin dozing percentage.
  optional double mbs_dozing = 6;
  // Updated spin cost code (max 100 chars).
  optional string mbs_mb_costing = 7 [(buf.validate.field).string.max_len = 100];
  // Updated active status.
  optional bool mbs_is_active = 8;
  // Optional MB/SP cost code (max 100 chars).
  optional string mbs_cc = 9 [(buf.validate.field).string.max_len = 100];
  // Optional MB rate MKT in USD/kg.
  optional double mbs_cost_rate_mkt = 10;
  // Optional Oracle CMBS_STATUS (max 100 chars).
  optional string mbs_status = 11 [(buf.validate.field).string.max_len = 100];
  // Optional Oracle CMBS_LDR_PRSN (≥ 0).
  optional double mbs_ldr_prsn = 12 [(buf.validate.field).double.gte = 0];
  // Optional Oracle CMBS_FINAL_PRODUCT (max 200 chars).
  optional string mbs_final_product = 13 [(buf.validate.field).string.max_len = 200];
  // Optional Oracle CMBS_RUN_LDR_PRSN — actual LDR percentage (≥ 0).
  optional double mbs_run_ldr_pct = 14 [(buf.validate.field).double.gte = 0];
  // Optional fix/actual marker for LDR. Absent = leave unchanged.
  optional bool mbs_ldr_is_fixed = 15;
  // Optional fix/actual marker for dozing. Absent = leave unchanged.
  optional bool mbs_dozing_is_fixed = 16;
  // Optional new LDR adjustment percentage. Absent = leave unchanged. Rejected by
  // the domain if the spin's LDR is currently locked as Actual — unlock first.
  optional double mbs_ldr_adjustment_pct = 17;
  // Optional lock/unlock instruction for LDR Actual status. true = lock as
  // Actual, false = unlock. Absent = no-op (leave the lock state untouched).
  optional bool mbs_ldr_lock_actual = 18;
  // Optional VS reference number. Absent = leave unchanged.
  optional string mbs_vs_number = 19 [(buf.validate.field).string.max_len = 50];
}

// UpdateMBSpinResponse is the response for updating an MB Spin record.
message UpdateMBSpinResponse {
  // Standard response metadata.
  common.v1.BaseResponse base = 1;
  // Updated MB Spin data.
  MBSpin data = 2;
  // Child spins deliberately left untouched by the recalc pass (rule A7).
  // Empty when every candidate child was recalculated.
  repeated MBSpinRecalcSkipped skipped = 3;
  // Number of skipped child spins. Equals len(skipped) — sent explicitly so a
  // caller that ignores the detail rows still gets the count.
  int32 skipped_count = 4;
  // Products that WOULD be affected, Top-N. ⛔ NOT a recalculation result (D24).
  // Reuses DozingImpactRow, the same row type PreviewDozingImpact returns, so
  // the UI can render both with one component.
  repeated DozingImpactRow impact_preview = 5;
  // Total number of affected products, before truncation.
  int32 impact_total_affected = 6;
  // Number of affected products whose costing is locked.
  int32 impact_total_locked = 7;
  // True when impact_preview was truncated by the server's row cap.
  bool impact_truncated = 8;
}

// DeleteMBSpinRequest is the request for soft-deleting an MB Spin record.
message DeleteMBSpinRequest {
  // Parent MB Head UUID.
  string mbh_id = 1 [(buf.validate.field).string.uuid = true];
