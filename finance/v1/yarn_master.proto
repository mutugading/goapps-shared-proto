  int32 skipped_count = 3;
  int32 failed_count = 4;
  repeated string errors = 5;
}

// =============================================================================
// SERVICE — LookupMasterService
// =============================================================================

// LookupMasterService provides lookup master registry for MASTER_LOOKUP param dropdowns.
service LookupMasterService {
  // ListLookupMasters returns all registered lookup masters.
  rpc ListLookupMasters(ListLookupMastersRequest) returns (ListLookupMastersResponse) {
    option (google.api.http) = {get: "/api/v1/finance/lookup-masters"};
  }
  // ListLookupMasterColumns returns the selectable columns for one lookup master.
  rpc ListLookupMasterColumns(ListLookupMasterColumnsRequest) returns (ListLookupMasterColumnsResponse) {
    option (google.api.http) = {get: "/api/v1/finance/lookup-master-columns"};
  }
  // CreateLookupMaster adds a new master to the registry.
  rpc CreateLookupMaster(CreateLookupMasterRequest) returns (CreateLookupMasterResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/lookup-masters"
      body: "*"
    };
  }
  // DeleteLookupMaster removes a master from the registry.
  rpc DeleteLookupMaster(DeleteLookupMasterRequest) returns (DeleteLookupMasterResponse) {
    option (google.api.http) = {delete: "/api/v1/finance/lookup-masters/{lm_code}"};
  }
  // CreateLookupMasterColumn adds a fillable column to a master.
  rpc CreateLookupMasterColumn(CreateLookupMasterColumnRequest) returns (CreateLookupMasterColumnResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/lookup-master-columns"
      body: "*"
    };
  }
  // DeleteLookupMasterColumn removes a column from a master.
  rpc DeleteLookupMasterColumn(DeleteLookupMasterColumnRequest) returns (DeleteLookupMasterColumnResponse) {
    option (google.api.http) = {delete: "/api/v1/finance/lookup-master-columns/{lmc_id}"};
  }
  // UpdateLookupMaster updates display_name, table_name, and/or is_active of an existing master.
  rpc UpdateLookupMaster(UpdateLookupMasterRequest) returns (UpdateLookupMasterResponse) {
    option (google.api.http) = {
      put: "/api/v1/finance/lookup-masters/{lm_code}"
      body: "*"
    };
  }
  // ListTableColumns introspects a registered PostgreSQL table's columns via information_schema.
  rpc ListTableColumns(ListTableColumnsRequest) returns (ListTableColumnsResponse) {
    option (google.api.http) = {get: "/api/v1/finance/lookup-master-table-columns"};
  }
  // ListMasterOptions returns combobox options (value+label) by querying the registered table.
  rpc ListMasterOptions(ListMasterOptionsRequest) returns (ListMasterOptionsResponse) {
    option (google.api.http) = {get: "/api/v1/finance/lookup-master-options"};
  }
  // ExportLookupMasters exports all masters and columns to an Excel workbook.
  rpc ExportLookupMasters(ExportLookupMastersRequest) returns (ExportLookupMastersResponse) {
    option (google.api.http) = {get: "/api/v1/finance/lookup-masters/export"};
  }
  // ImportLookupMasters imports masters and columns from an Excel workbook.
  rpc ImportLookupMasters(ImportLookupMastersRequest) returns (ImportLookupMastersResponse) {
    option (google.api.http) = {
      post: "/api/v1/finance/lookup-masters/import"
      body: "*"
    };
  }
}

// =============================================================================
// SERVICE — YarnLookupFill
// =============================================================================

// YarnLookupFillService provides a unified "fill from master" API used by the CAPP form.
// Called when the user selects a lookup param value (e.g., a machine code).
// Returns numeric and text fills to auto-populate related CAPP params.
service YarnLookupFillService {
  // GetLookupFillValues returns numeric and text fills to auto-populate CAPP params.
  rpc GetLookupFillValues(GetLookupFillValuesRequest) returns (GetLookupFillValuesResponse) {
    option (google.api.http) = {get: "/api/v1/finance/lookup-fill-values"};
  }
}

// =============================================================================
// MESSAGES — MB Costing Suite: Composition, Lusture, Param, Cost, Logs
// =============================================================================

// MbComposition represents a single composition line for an MB Head (editable while DRAFT).
message MbComposition {
  // UUID primary key.
  string mbcm_id = 1;
  // Parent MB Head UUID.
  string mbh_id = 2;
  // Display sequence number within the head.
  int32 seq_no = 3;
  // Referenced RM group head UUID.
  string group_head_id = 4;
  // Composition percentage. NUMERIC(6,3) as string.
  string composition_pct = 5;
  // Source type: GROUP/MB/CARRIER.
  string source_type = 6;
  // Referenced MB Head UUID when source_type is MB. Nullable, empty string if unset.
  string mb_ref_mbh_id = 7;
  // Whether this line represents the carrier component.
  bool is_carrier = 8;
  // Legacy Oracle system ID for reconciliation.
  string legacy_sys_id = 9;
  // Audit metadata.
  common.v1.AuditInfo audit = 10;
}

// MbCompositionVersion is a frozen snapshot of a composition line captured at validation time.
message MbCompositionVersion {
  // UUID primary key.
  string mbcv_id = 1;
  // Parent MB Head UUID.
  string mbh_id = 2;
  // Version number this snapshot belongs to.
  int32 version = 3;
  // Timestamp when this version was validated.
  string validated_at = 4;
  // User who validated this version.
  string validated_by = 5;
  // Display sequence number within the head.
  int32 seq_no = 6;
  // Referenced RM group head UUID.
  string group_head_id = 7;
  // Composition percentage. NUMERIC(6,3) as string.
  string composition_pct = 8;
  // Source type: GROUP/MB/CARRIER.
  string source_type = 9;
  // Referenced MB Head UUID when source_type is MB.
  string mb_ref_mbh_id = 10;
  // Whether this line represents the carrier component.
  bool is_carrier = 11;
}

// MbLusture is a master lookup entry for MB lusture types.
message MbLusture {
  // UUID primary key.
  string mbl_id = 1;
  // Unique lusture code.
  string code = 2;
  // Display name.
  string display_name = 3;
  // Full description.
  string full_description = 4;
  // Category grouping.
  string category = 5;
  // Whether the record is active.
  bool is_active = 6;
  // Display ordering hint.
  int32 display_order = 7;
  // Audit metadata.
  common.v1.AuditInfo audit = 8;
}

// MbParam is a master costing parameter definition (SCALAR or PICKLIST).
message MbParam {
  // UUID primary key.
  string mbp_id = 1;
  // Unique parameter code.
  string code = 2;
  // Display name.
  string name = 3;
  // Description.
  string description = 4;
  // Parameter type: SCALAR/PICKLIST.
  string type = 5;
  // Default numeric value. NUMERIC as string, empty if PICKLIST.
  string default_value = 6;
  // Default option code, empty if SCALAR.
  string default_option = 7;
  // Unit of measure label.
  string unit = 8;
  // Display ordering hint.
  int32 display_order = 9;
  // Whether the record is active.
  bool is_active = 10;
  // Audit metadata.
  common.v1.AuditInfo audit = 11;
  // Picklist options, populated when type is PICKLIST.
  repeated MbParamOption options = 12;
}

// MbParamOption is a single picklist option belonging to an MbParam.
message MbParamOption {
  // UUID primary key.
  string mbpo_id = 1;
  // Parent parameter code.
  string mbp_code = 2;
  // Option code.
  string code = 3;
  // Numeric value represented by this option.
  string numeric_value = 4;
  // Description.
  string description = 5;
  // Display ordering hint.
  int32 display_order = 6;
  // Whether the record is active.
  bool is_active = 7;
}

// MbCost represents a costed value for an MB Head for a given period and cost type.
message MbCost {
  // UUID primary key.
  string mbc_id = 1;
  // Parent MB Head UUID.
  string mbh_id = 2;
  // Period in YYYYMM format.
  string period = 3;
  // Cost type: ACTUAL/SELLING/FORECAST.
  string cost_type = 4;
  // Cost value. NUMERIC as string.
  string cost_value = 5;
  // Source cost-product-cost ID this value was pushed from.
  int64 source_cpc_id = 6;
  // Timestamp when this value was pushed.
  string pushed_at = 7;
  // User who pushed this value.
  string pushed_by = 8;
  // Whether this cost row is active.
  bool is_active = 9;
}

// MbPushLog records a single push-to-head batch execution.
message MbPushLog {
  // UUID primary key.
  string mbpl_id = 1;
  // Period in YYYYMM format.
  string period = 2;
  // Timestamp when the push was executed.
  string pushed_at = 3;
  // User who executed the push.
  string pushed_by = 4;
  // Number of MB Heads affected.
  int32 mb_count = 5;
  // Number of cost rows written.
  int32 row_count = 6;
  // Comma-separated cost types pushed.
  string cost_types = 7;
  // Previous period, used for carry-forward comparisons.
  string previous_period = 8;
  // Free-text notes.
  string notes = 9;
}

// MbWorkflowLog records a single workflow state transition for an MB Head.
message MbWorkflowLog {
  // UUID primary key.
  string mbwl_id = 1;
  // Parent MB Head UUID.
  string mbh_id = 2;
  // State transitioned from.
  string from_state = 3;
  // State transitioned to.
  string to_state = 4;
  // User who performed the transition.
  string actor_user_id = 5;
  // Timestamp of the transition.
  string actor_at = 6;
  // Reason captured for the transition, if any.
  string reason = 7;
  // Composition version at the time of the transition.
  int32 version = 8;
}

