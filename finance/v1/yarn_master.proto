// ExportMBRecipeFullRequest is the request for the denormalized full recipe export
// (P12 / items C1 + C2): one Excel row per composition line, with the MB cost block
// joined in. Read-only — it never writes to cst_mb_cost or cst_product_cost.
message ExportMBRecipeFullRequest {
  // Filter by active status of the MB head.
  ActiveFilter active_filter = 1;
  // Cost period YYYYMM. Empty means "latest period per head".
  string period = 2 [(buf.validate.field).string = {pattern: "^$|^[0-9]{6}$"}];
  // Cost type to include. Empty defaults to ACTUAL, which keeps the row count
  // bounded to one cost row per composition line.
  string cost_type = 3 [(buf.validate.field).string = {
    in: [
      "",
      "ACTUAL",
      "SELLING",
      "FORECAST"
    ]
  }];
  // Filter by the DERIVED check status (mst_mb_head.mbh_check_status_calc, P10).
  //
  // Empty means ALL ROWS, including heads whose derived status is still NULL — so
  // leaving this unset keeps the export byte-for-byte identical to its behaviour
  // before this filter existed. A non-empty value keeps only heads carrying exactly
  // that value, which necessarily EXCLUDES the NULL ("Belum dihitung") heads.
  //
  // The six accepted values are the six allowed by the CHECK constraint
  // chk_mbh_check_status_calc (migration 000487). ⚠ Only THREE of them are produced
  // by DeriveCheckStatus today — "Boughtout", "Approved", "Waiting". Filtering by
  // "Current", "Outdated" or "Rejected" is therefore VALID but returns ZERO ROWS
  // until the corresponding user gates are decided. ⛔ Not a bug.
  //
  // ⛔ There is deliberately NO sentinel for "only the NULL heads" — that semantic
  // has not been decided by the user.
  string check_status_calc = 4 [(buf.validate.field).string = {
    in: [
      "",
      "Waiting",
      "Current",
      "Boughtout",
      "Approved",
      "Outdated",
      "Rejected"
    ]
  }];
  // Whether to include REJECTED documents in the export.
  //
  // Default false (proto3 zero value) EXCLUDES rejected documents, keeping this
  // export byte-for-byte identical to its behaviour before this field existed.
  // Set to true to include them (audit use case).
  bool include_rejected = 5;
}

// ExportMBRecipeFullResponse carries the full-recipe Excel workbook bytes.
message ExportMBRecipeFullResponse {
  // Standard response metadata.
  common.v1.BaseResponse base = 1;
  // Excel file content.
  bytes file_content = 2;
  // Excel file name.
  string file_name = 3;
}

// ExportMBCostCalcDetailRequest is the request for the flat MB cost-calculation dump
// (29 snake_case columns): one row per (MB head, RM line) taken from the persisted
// cst_product_cost snapshot — cpc_rm_cost_detail for the RM lines and
// cpc_param_snapshot for the MB-level calc figures.
//
// ⛔ DELIBERATELY SEPARATE from ExportMBRecipeFull. That export is the 37-column
// recipe+cost report and must stay byte-for-byte unchanged; this one is a calc dump
// with a different grain (RM lines from the COST SNAPSHOT, not composition rows) and
// a different column set. ⛔ Do not merge them.
message ExportMBCostCalcDetailRequest {
  // Filter by active status of the MB head.
  ActiveFilter active_filter = 1;
  // Cost period YYYYMM. Empty means "latest calculated period per head".
  string period = 2 [(buf.validate.field).string = {pattern: "^$|^[0-9]{6}$"}];
  // Calculation type of the cost snapshot to dump. Empty defaults to ACTUAL, which
  // keeps exactly one cost snapshot per head and therefore one row per RM line.
  string calculation_type = 3 [(buf.validate.field).string = {
    in: [
      "",
      "ACTUAL",
      "SELLING",
      "FORECAST"
    ]
  }];
  // Filter on the cost snapshot status (cst_product_cost.cpc_status). Empty means
  // ALL non-superseded statuses — the four values are the ones allowed by the CHECK
  // constraint chk_cpc_status (migration 000228).
  string calc_status = 4 [(buf.validate.field).string = {
    in: [
      "",
      "CALCULATED",
      "VERIFIED",
      "APPROVED",
      "SUPERSEDED"
    ]
  }];
  // Whether to include REJECTED MB Heads. Default false (proto3 zero value) excludes
  // them, mirroring ExportMBRecipeFull's behaviour.
  bool include_rejected = 5;
}

// ExportMBCostCalcDetailResponse carries the cost-calc-detail Excel workbook bytes.
