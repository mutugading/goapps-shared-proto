syntax = "proto3";

package payroll.v1;

import "buf/validate/validate.proto";
import "common/v1/common.proto";

// =============================================================================
// Payroll run & period (spec 07§4–5, decision D-51).
//
// Phase 1 scope: CreateRun is always synchronous (dry or commit); no cancel,
// SSE or 202 responses (those stay in B-API-RUN phase 2). GetRunDiff: T030c.
//
// All nominal fields are decimal strings (never float). Without permission
// payroll.salary.amount.view every nominal field is the literal "***", which is
// why they are strings and not Money (D-51, invariant I23).
// =============================================================================

// RunMode selects dry-run (nothing persisted as ACTIVE) or commit.
enum RunMode {
  RUN_MODE_UNSPECIFIED = 0;
  RUN_MODE_DRY = 1;
  RUN_MODE_COMMIT = 2;
}

// Run is the summary of one payroll run (≈ pyr_run).
message Run {
  int64 run_id = 1;
  int32 yymm = 2;
  string division = 3;
  string process_date = 4; // YYYY-MM-DD
  // ACTIVE | SUPERSEDED | FAILED | DRY.
  string status = 5;
  int32 employee_count = 6;
  int32 line_count = 7;
  // Nominal: decimal string, or "***" when masked.
  string total_tunjangan = 8;
  // Nominal: decimal string, or "***" when masked.
  string total_potongan = 9;
  int32 rule_set_id = 10;
  int64 snapshot_id = 11;
  repeated string nik_filter = 12;
  // Warnings stay visible when nominals are masked.
  repeated string warnings = 13;
  string started_by = 14;
  string started_at = 15; // RFC3339
  string finished_at = 16; // RFC3339, empty while running.
  int64 duration_ms = 17;
}

// RunLine is one component line of one employee (≈ pyr_salary_detail).
message RunLine {
  string nik = 1;
  // T = tunjangan, P = potongan.
  string comp_type = 2;
  int32 comp_id = 3;
  string description = 4;
  // Nominal: decimal string, or "***" when masked.
  string amount = 5;
  // Nominal: decimal string, or "***" when masked.
  string base = 6;
  // Quantity stays visible when masked.
  string qty = 7;
  // Nominal: decimal string, or "***" when masked.
  string rate = 8;
  string formula = 9;
  string remarks = 10;
}

// EmployeeTotal is the per-employee total of a run (≈ pyr_salary_head).
message RunEmployeeTotal {
  string nik = 1;
  string name = 2;
  // Nominal: decimal string, or "***" when masked.
  string total_tunjangan = 3;
  // Nominal: decimal string, or "***" when masked.
  string total_potongan = 4;
  // Nominal: decimal string, or "***" when masked.
  string take_home = 5;
}

// Period is the payroll period status per (yymm, division) (≈ pyr_period).
message Period {
  int32 yymm = 1;
  string division = 2;
  string date_from = 3; // YYYY-MM-DD
  string date_to = 4; // YYYY-MM-DD
  // OPEN | APPROVED | CLOSED.
  string status = 5;
  int64 active_run_id = 6; // 0 = none.
  string approved_by = 7;
  string approved_at = 8;
  string closed_by = 9;
  string closed_at = 10;
  string reopen_reason = 11;
}

// ── Run ──────────────────────────────────────────────────────────────────────

message CreateRunRequest {
  int32 yymm = 1 [(buf.validate.field).int32 = {
    gte: 190001
    lte: 999912
  }];
  string division = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 30
  }];
  int32 company_id = 3 [(buf.validate.field).int32.gte = 0]; // 0 = derived from the caller scope (dry only, D-71)
  string process_date = 4 [(buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"]; // YYYY-MM-DD
  RunMode mode = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Optional: limit the run to these NIKs (single-employee reprocess).
  repeated string nik = 6 [(buf.validate.field).repeated = {
    max_items: 500
    items: {
      string: {
        min_len: 1
        max_len: 15
      }
    }
  }];
}

message CreateRunResponse {
  common.v1.BaseResponse base = 1;
  Run data = 2;
  // Dry mode: per-employee totals. Commit mode: empty (use ListRunLines).
  repeated RunEmployeeTotal employees = 3;
}

message GetRunRequest {
  int64 run_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetRunResponse {
  common.v1.BaseResponse base = 1;
  Run data = 2;
}

message ListRunsRequest {
  int32 yymm = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 999912
  }]; // 0 = all.
  string division = 2 [(buf.validate.field).string.max_len = 30]; // Empty = all in scope.
}

message ListRunsResponse {
  common.v1.BaseResponse base = 1;
  repeated Run data = 2;
}

message ListRunLinesRequest {
  int64 run_id = 1 [(buf.validate.field).int64.gt = 0];
  string nik = 2 [(buf.validate.field).string.max_len = 15]; // Empty = all.
  int32 page = 3 [(buf.validate.field).int32.gte = 0]; // 0 = 1.
  int32 page_size = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 500
  }]; // 0 = 100.
}

message ListRunLinesResponse {
  common.v1.BaseResponse base = 1;
  repeated RunLine data = 2;
  common.v1.PaginationResponse pagination = 3;
}

// ── Run diff (07§4, T030c) ───────────────────────────────────────────────────

message GetRunDiffRequest {
  int64 run_id = 1 [(buf.validate.field).int64.gt = 0];
  // Empty or active = the ACTIVE run of the period | legacy = the LEGACY run of the
  // period (recon, D-41) | run:<id> = another run of the same period.
  string against = 2 [(buf.validate.field).string = {pattern: "^(|active|legacy|run:[1-9][0-9]{0,18})$"}];
  string nik = 3 [(buf.validate.field).string.max_len = 15]; // Empty = all.
  // Line category filter (e.g. FORMULA); empty = every non-MATCH line.
  string category = 4 [(buf.validate.field).string = {
    max_len: 20
    pattern: "^[A-Z_]*$"
  }];
  int32 page = 5 [(buf.validate.field).int32.gte = 0]; // 0 = 1.
  int32 page_size = 6 [(buf.validate.field).int32 = {
    gte: 0
    lte: 500
  }]; // 0 = 100.
}

// RunDiffLine is one non-MATCH (nik, component) line; delta = run - against.
message RunDiffLine {
  string nik = 1;
  string component = 2; // T001 / P032
  // Nominal: decimal string ("" = no line / NULL), or "***" when masked.
  string legacy_amount = 3;
  // Nominal: decimal string ("" = no line / NULL), or "***" when masked.
  string target_amount = 4;
  // Nominal: decimal string, or "***" when masked.
  string delta_amount = 5;
  // ROUNDING | FORMULA | INPUT_ATT | INPUT_MASTER | ONLY_LEGACY | ONLY_TARGET |
  // MASTER_DRIFT | KNOWN_DEFECT.
  string category = 6;
}

// RunDiffHead is a NIK whose header totals differ or exist on one side only.
message RunDiffHead {
  string nik = 1;
  bool has_legacy = 2;
  bool has_target = 3;
  // Nominals: decimal string ("" when the side is missing), or "***" when masked
  // (a missing side is "***" too).
  string legacy_total_tunjangan = 4;
  string legacy_total_potongan = 5;
  string legacy_take_home = 6;
  string target_total_tunjangan = 7;
  string target_total_potongan = 8;
  string target_take_home = 9;
  // D-47/D-50 exclusion reason (against=legacy only); empty = counted.
  string excluded = 10;
}

// RunDiffExclusion aggregates the NIKs left out of parity (D-47/D-50).
message RunDiffExclusion {
  string reason = 1;
  int32 nik = 2;
  int32 lines = 3;
  int32 other_lines = 4;
  int32 head_mismatch = 5;
  // Nominals: decimal string, or "***" when masked.
  string take_home_legacy = 6;
  string take_home_target = 7;
  string take_home_delta = 8;
}

message RunDiffSummary {
  // Line count per category (MATCH included).
  map<string, int32> categories = 1;
  int32 nik_legacy = 2;
  int32 nik_target = 3;
  int32 head_mismatch = 4;
  // Nominals: decimal string, or "***" when masked.
  string take_home_legacy = 5;
  string take_home_target = 6;
  string take_home_delta = 7;
  // Parity verdict of rule set v1 (09§4, D-49).
  bool parity = 8;
  repeated RunDiffExclusion excluded = 9;
}

message RunDiff {
  int64 run_id = 1;
  string against = 2;
  // Run id of the against side (the LEGACY run for against=legacy).
  int64 against_run_id = 3;
  int32 yymm = 4;
  string division = 5;
  RunDiffSummary summary = 6;
  // Lines of the requested page (filters applied).
  repeated RunDiffLine lines = 7;
  // Every header mismatch (nik filter applied).
  repeated RunDiffHead heads = 8;
  // Code and NIK stay visible; the message is masked like Run.warnings.
  repeated string warnings = 9;
}

message GetRunDiffResponse {
  common.v1.BaseResponse base = 1;
  RunDiff data = 2;
  // Pagination of data.lines.
  common.v1.PaginationResponse pagination = 3;
}

// ── Period ───────────────────────────────────────────────────────────────────

message ListPeriodsRequest {
  string division = 1 [(buf.validate.field).string.max_len = 30]; // Empty = all in scope.
}

message ListPeriodsResponse {
  common.v1.BaseResponse base = 1;
  repeated Period data = 2;
}

message ApprovePeriodRequest {
  int32 yymm = 1 [(buf.validate.field).int32 = {
    gte: 190001
    lte: 999912
  }];
  string division = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 30
  }];
}

message ApprovePeriodResponse {
  common.v1.BaseResponse base = 1;
  Period data = 2;
}

message ClosePeriodRequest {
  int32 yymm = 1 [(buf.validate.field).int32 = {
    gte: 190001
    lte: 999912
  }];
  string division = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 30
  }];
}

message ClosePeriodResponse {
  common.v1.BaseResponse base = 1;
  Period data = 2;
}

message ReopenPeriodRequest {
  int32 yymm = 1 [(buf.validate.field).int32 = {
    gte: 190001
    lte: 999912
  }];
  string division = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 30
  }];
  // Mandatory, at least 10 characters (spec 07§5).
  string reason = 3 [(buf.validate.field).string = {
    min_len: 10
    max_len: 1000
  }];
}

message ReopenPeriodResponse {
  common.v1.BaseResponse base = 1;
  Period data = 2;
}
